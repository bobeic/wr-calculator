<!doctype html><html><head></head><body><script id="__NEXT_DATA__" type="application/json">{"props": {"pageProps": {"page": {"blades": [{"type": "riotbar"}, {"type": "articleMasthead", "title": "Wild Rift Patch Notes 7.3a", "publishDate": "2026-09-29T09:00:00.000Z"}, {"type": "articleRichText", "richText": {"body": "<p>The stage is set, but we’re making a few adjustments to the lineup. This patch, we’re tuning some of our marksmen, bringing Hwei’s masterpiece back within the margins, and making adjustments across items, the jungle, and Turret Plating. We’re also following up on AAA ARAM with a round of changes based on your feedback. Let’s get into it!</p><p><i>Reminder: content will be released throughout the patch.</i></p>"}}, {"type": "separator"}, {"type": "characterChanges", "title": "CHAMPION CHANGES", "characters": [{"character": {"name": "HWEI"}, "changes": [{"title": "Signature of the Visionary", "description": {"body": "<ul><li><meta>Damage: 33 - 333 (Based on level) + 33%Ability Power → 40-285 (Based on level)&nbsp; + 30% Ability Power</li></ul>"}}, {"title": "Subject: Disaster - Devastating Fire", "description": {"body": "<ul><li>Damage: 50/90/130/170 + 75% Ability Power + 4%/5%/6%/7% Maximum Health → 50/85/120/155 + 70% Ability Power + 4%/5%/6%/7% Maximum Health</li></ul>"}}, {"title": "Subject: Disaster - Severing Bolt", "description": {"body": "<ul><li>Damage Ratio based on Health lost: 150%/200%/250%/300% → 100%/150%/200%/250%</li></ul>"}}, {"title": "Spiraling Despair", "description": {"body": "<ul><li>Explosion Damage: 250/350/450 + 75% Ability Power → 200/300/400 + 70% Ability Power</li></ul>"}}]}, {"character": {"name": "SAMIRA"}, "changes": [{"title": "Base Stats", "description": {"body": "<ul><li>Health per level：128 → 136</li><li>Armor per level：5 → 5.5</li><li>Magic Resistance per level：1.4 → 2<br>&nbsp;</li></ul>"}}, {"title": "Daredevil Impulse", "description": {"body": "<ul><li>Minimum Attack Damage ratio for melee damage: 3.5% - 10.5% (Based on level) &nbsp;→ 5.8% - 17% (Based on level)</li><li>Maximum Attack Damage ratio for melee damage: 7% - 21% (Based on level) &nbsp;→ 11.6% - 34% (Based on level)&nbsp;<br>&nbsp;</li></ul>"}}, {"title": "Flair", "description": {"body": "<ul><li>Attack Damage ratio: 110% → 125%</li></ul>"}}, {"title": "Inferno Trigger", "description": {"body": "<ul><li>Attack Damage ratio per shot: 40% → 50%</li></ul>"}}]}, {"character": {"name": "RAMMUS"}, "changes": [{"title": "Base Stats", "description": {"body": "<ul><li>Armor：45 → 40</li></ul>"}}, {"title": "Defensive Ball Curl", "description": {"body": "<ul><li>Armor ratio: 45%/50%/55%/60% → 30%/40%/50%/60%</li></ul>"}}]}, {"character": {"name": "MALPHITE"}, "changes": [{"title": "Thunderclap", "description": {"body": "<ul><li>Armor Damage Ratio: 20% → 15%</li></ul>"}}, {"title": "Ground Slam", "description": {"body": "<ul><li>Armor Damage ratio: 45% → 40%</li></ul>"}}, {"title": "Unstoppable Force", "description": {"body": "<ul><li>Cooldown: 75/70/65s → 85/80/75s</li></ul>"}}]}, {"character": {"name": "TRISTANA"}, "changes": [{"title": "Rapid Fire", "description": {"body": "<ul><li>Attack Speed: 50/75/100/125% → 60/80/100/120%</li></ul>"}}, {"title": "Rocket Jump", "description": {"body": "<ul><li>Cooldown: 22/20/18/16s → 20/18/16/14s</li></ul>"}}, {"title": "Explosive Charge", "description": {"body": "<ul><li>Explosion Damage: (80/100/120/140 + 100% Bonus Attack Damage + 50% Ability Power) × (1 + Critical Rate × 40% + (Crit Damage - 2) × 40% × Critical Rate)→ (80/110/140/170 + 120% Bonus Attack Damage + 50% Ability Power) × (1 + Critical Rate × 50% + (Crit Damage - 2) × 50% × Critical Rate)</li></ul>"}}]}, {"character": {"name": "DRAVEN"}, "changes": [{"title": "Spinning Axe", "description": {"body": "<ul><li>Bonus Attack Damage ratio: 80/90/100/110% → 90/100/110/120%</li></ul>"}}, {"title": "Blood Rush", "description": {"body": "<ul><li>Attack Speed: 20/25/30/35% → 25/30/35/40%</li></ul>"}}, {"title": "Whirling Death", "description": {"body": "<ul><li>Bonus Attack Damage ratio: 130% → 150%</li></ul>"}}]}, {"character": {"name": "CAITLYN"}, "changes": [{"title": "Base stats", "description": {"body": "<ul><li>Attack Speed per level: 0.04 → 0.025</li></ul>"}}, {"title": "Headshot", "description": {"body": "<ul><li>60% -100% (Based on level) → 60% -90% (Based on level)&nbsp;</li></ul>"}}]}, {"character": {"name": "SENNA"}, "changes": [{"title": "Base Stats", "description": {"body": "<ul><li>Attack Speed ratio: 0.4 → 0.3</li><li>Base Attack Speed: 0.4 → 0.3</li><li>Base Bonus Attack Speed0.6 → 1.1</li><li>Attack Speed per level: 0.05 → 0.025</li><li>Bonus Attack Speed now provides less benefit toward reducing her basic attack windup.&nbsp;</li></ul>"}}]}, {"character": {"name": "SYNDRA"}, "changes": [{"title": "Transcendent", "description": {"body": "<ul><li>Upgrade threshold: 40/60/80/100/120 → 50/75/100/125/150</li></ul>"}}, {"title": "Force of Will", "description": {"body": "<ul><li>Ability Power ratio: 60% → 50%</li><li>Slow: 20%/25%/30%/35% → 25%</li></ul>"}}]}, {"character": {"name": "SWAIN"}, "changes": [{"title": "Ravenous Flock", "description": {"body": "<ul><li>Health Restored: 3% - 4.5% (Based on level) + 0.5% Ability Power -&gt; 4.5% - 6% + 0.2% Ability Power</li></ul>"}}, {"title": "Nevermove", "description": {"body": "<ul><li>Ability Power ratio of the repeated damage: 25% → 40%</li></ul>"}}]}, {"character": {"name": "YUUMI"}, "changes": [{"title": "You and Me!", "description": {"body": "<ul><li>Healing and Shield Power: 8%/9%/10%/11% + 0.02% Ability Power → 6%/7%/8%/9% + 0.01%a Ability Power</li></ul>"}}]}, {"character": {"name": "VIEGO"}, "changes": [{"title": "Blade of the Ruined King", "description": {"body": "<ul><li>Passive Damage: 2%/3%/4%/5% → 3%/4%/5%/6%</li><li>Crit Damage ratio: 80% → 85%</li></ul>"}}, {"title": "Heartbreaker", "description": {"body": "<ul><li>Crit stats ratio: 50%→ 70%&nbsp;</li></ul>"}}]}]}, {"type": "articleRichText", "richText": {"body": "<h2>GAMEPLAY CHANGES</h2><h2>ITEMS</h2><h4>Yun Tal Wildarrows</h4><p>Yun Tal Wildarrows has been falling behind other first-item options. We’re increasing its base stats and strengthening its effect to make it a more competitive early purchase.</p><p>Base Stats:&nbsp;</p><ul><li>Attack Speed: 25% → 35%</li></ul><p>Flurry:</p><ul><li>Attack Speed: 25% → 35%</li><li>Cooldown: 20s → 25s</li></ul><h4>Whispering Circlet</h4><p>We’re adjusting Whispering Circlet to match the changes to Diadem of Songs.</p><p>Harmony:&nbsp;</p><ul><li>Healing and Shield Power: 0.5% → 0.25%</li></ul><h4>Diadem of Songs&nbsp;</h4><p>Diadem of Songs has been outperforming other support item options. We’re reducing its overall power so it’s a more situational choice rather than the go-to option for most supports.</p><p>Harmony:&nbsp;</p><ul><li>Healing and Shield Power: 0.5% → 0.25%</li></ul><h4>Death's Dance</h4><p>Death's Dance is providing too much value for its cost. Rather than reducing its power as a core fighter item, we’re increasing its price.</p><p>Base Stats:&nbsp;</p><ul><li>3200 → 3300</li></ul><h2>Other Battlefield Content</h2><p>Smite</p><p>Smite is providing too much jungle clear speed, particularly in the early and mid game. We’re reducing its base burn damage while preserving its scaling as junglers complete their items.</p><ul><li>Smite’s Damage to Jungle monsters per second: 30 - 198 (Based on level) → 22 - 162&nbsp; (Based on level)&nbsp;</li></ul><h2>Nexus</h2><p>The new Turret Plating system is already doing enough to limit sustained pushes, so we’re reverting the Nexus Health increase.</p><ul><li>&nbsp;Maximum Health：5500→4000</li></ul><p>Turret Plating</p><p>Turret Plating is providing too much resistance against sustained pushes. We’re reducing the durability granted after a plate falls to better reward successful pushes.</p><ul><li>Armor and Magic Resistance gained after a plate falls: 30→20</li><li>Duration of Armor and Magic Resistance after a plate falls: 20s→10s</li></ul><h2>GAME MODE CHANGES</h2><h3>AAA ARAM</h3><p>Since AAA ARAM launched, we've received a lot of detailed feedback about your experiences with the mode. Thank you to everyone who has shared the issues you've encountered and your thoughts with us. With this hotfix, we're addressing a few areas that have been affecting the experience, and we'll continue monitoring how these changes perform.</p><p>First up is the HEARTSTEEL set. Rhythm Hunter has performed quite differently depending on whether it's facing melee or ranged team comps, so we're adjusting its trigger range and Steel Token multiplier while also making its visual feedback clearer. When Infinite Encore is taken as your fifth Augment after you've already picked up other HEARTSTEEL cards in your first four slots, it still increases your Steel Token gain multiplier, but any remaining rerolls can no longer be used. That didn't feel great, so we're adding the corresponding number of stacks to compensate. If you're able to obtain a sixth Rune Card, those additional rerolls can still be used.</p><p>The updated Ethereal Weapon has opened up a number of interesting builds, and we're happy to see players experimenting with them. However, we also need to keep the experience of playing against it in mind, so we're adding a 1-second cooldown per individual ability against the same target. Blitzcrank can still continuously electrocute enemies for now; we'll continue monitoring how this adjustment plays out in practice.</p><p>We also went a little too far with some of our previous Augment nerfs. We're partially reverting those nerfs with this hotfix, though their overall power will remain lower than before.</p><p>The overall meta still needs some time to settle, so we're keeping champion adjustments relatively light this time around. We'll continue monitoring how these changes perform and listening closely to your feedback. Thanks for continuing to share your thoughts with us, and we hope you have fun!</p><h4>Augment Adjustments</h4><h5>Rhythm Hunter</h5><ul><li>Trigger distance: 7 → 11。</li><li>Steelbuff multiplier per stack: 12 → 8。</li><li>Improved Rhythm Hunter’s visual effects.&nbsp;</li></ul><h5>Neverending Encore</h5><ul><li>When obtaining this Augment in the fifth round or later, immediately gain the number of stacks that would be granted by using 6 rerolls (180 stacks).&nbsp;</li></ul><h5>Galestrike</h5><p><i>We're slightly reverting some of the previous nerfs, though these effects will still be weaker overall than in the previous patch.</i></p><ul><li>Attack Range: 8 → 9</li></ul><h5>Cycle of Life</h5><p><i>We're slightly reverting some of the previous nerfs, though these effects will still be weaker overall than in the previous patch.</i></p><ul><li>Shield ratio gained: 150% → 200%</li></ul><h5>Ethereal Weapon</h5><ul><li>Each individual ability now has a 1s cooldown per target.&nbsp;</li></ul><h5>Duet</h5><ul><li>Cooldown per target: 5s → 2s</li></ul><h5>Metal Crown</h5><ul><li>Stats gained after casting your ultimate: 35 Attack Damage, 70 Ability Power, 50 Armor, 50 Magic Resistance → 30 Attack Damage, 60 Ability Power, 40 Armor, 40 Magic Resistance.&nbsp;</li></ul><h5>Hextech Shrapnel</h5><ul><li>Damage amplification for the other damage type: 20% → 30%.&nbsp;</li></ul><h5>Darkin Beacon</h5><ul><li>Damage tracking: Post-mitigation damage → Pre-mitigation damage.&nbsp;</li></ul><h5>Stack One Up</h5><ul><li>Damage increase per stack: 8 → 12.&nbsp;</li><li>The cooldown of the bonus damage is now affected by Ability Haste; gaining stacks itself has no cooldown.&nbsp;</li></ul><h5>Accelerating Sorcery</h5><ul><li>Maximum Stack: 100 stacks → 66 stacks</li></ul><h5>Pinnacle of Perfection</h5><ul><li>Critical Rate cap: 50% → 44.44%</li><li>Conversion ratio for Critical Rate exceeding the cap: 150% → 444%</li><li>Maximum Conversion cap: 305% → 400%</li><li>After this change, you can reach the Crit Damage cap without Infinity Edge.&nbsp;</li></ul><h4>Champion Adjustment</h4><h5>Fiddlestick</h5><ul><li>Damage Taken: 90% → 85%</li></ul><h5>Nasus</h5><ul><li>Damage Taken: 100% → 90%</li></ul>"}}, {"type": "articleCardCarousel"}]}}}}</script></body></html>
