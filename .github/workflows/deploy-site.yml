name: Deploy site

# Builds the static site and publishes it on GitHub Pages on every push to main (and by hand). One-time setup:
# repository Settings -> Pages -> Source: "GitHub Actions". Without a custom domain the site is served under
# /<repo>/, so the build gets that base path from configure-pages; with a custom domain the base path is empty.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one but never cancels a deploy in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: pages
        uses: actions/configure-pages@v6
      # Game art is downloaded at build time (art:update only fetches files it doesn't have); keep it between runs.
      - uses: actions/cache@v5
        with:
          path: apps/web/public/art
          key: art-v1-${{ github.run_id }}
          restore-keys: art-v1-
      - name: Build the static site
        run: pnpm --filter @wr-calc/web build
        env:
          NEXT_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
