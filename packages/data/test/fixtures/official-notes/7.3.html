e additional on-hit effect to the target. (1.5 second cooldown) Deals reduced damage to structures.</li></ul><h4>Nashor's Tooth</h4><p>Nashor’s Tooth’s Adaptive Force hasn’t created many meaningful build opportunities, while limiting how much power we can give its other stats. We’re removing it and returning Nashor’s Tooth to its roots as a dedicated Ability Power item.</p><p><i>Base Stats</i></p><ul><li>Build Path: Nashor's Talon (800) + Recurve Bow (1400) + 600 → Recurve Bow (900) + Blasting Wand (800) + Fiendish Codex (900) + 300</li><li>Total Price: 2800 → 2900</li><li>Attack Speed: 45% → 50%</li><li>[New] Ability Power: 80</li><li>Ability Haste: 20 → 15</li></ul><p>Gnaw:</p><ul><li>Basic attacks deal 15 + 20% bonus Ability Power magic damage on hit.</li></ul><p>Magic Fang:</p><ul><li>[Removed]</li></ul><h4>Luden's Echo</h4><p>Luden’s Echo has been a little too effective at spreading its damage across multiple targets. We’re reducing its multi-target damage while leaving its single-target power unchanged, keeping it effective when you’re focused on bursting down one opponent.</p><p>Echo:</p><ul><li>Your next damaging ability or empowered basic attack deals 75 + 8% Ability Power magic damage to the primary target and up to 5 nearby enemies. For each fewer target hit by Echo, the primary target takes an additional 20 + 1.2% Ability Power magic damage. (9 second cooldown)</li></ul><h4>Sunfire Aegis</h4><p>Sunfire Aegis’s stacking and basic attack mechanics have made its damage harder to understand, while allowing champions with high Attack Speed and mobility to get more value from it than intended. We’re simplifying its damage mechanic and shifting its power toward high-Health tanks, giving the item a clearer identity and making its damage more intuitive.</p><p>Immolate:</p><ul><li>Upon entering combat, deals 20 + 1.5% bonus Health Magic Damage to nearby enemies every second. Immolate deals 175%–250% damage to minions and 130% damage to monsters.</li></ul><p>Flametouch:</p><ul><li>[Removed]</li></ul><h4>Infinity Orb</h4><p>Inevitable Demise</p><ul><li>Critical Strike Threshold: 35% → 40%</li></ul><h4>Sterak's Gage</h4><p><i>Base Stats</i></p><ul><li>[New] Tenacity: 20%</li></ul><p>Sterak's Fury&nbsp;</p><ul><li>Tenacity Removed.</li></ul><h4>Tear of the Goddess&nbsp;</h4><p><i>Base Stats</i></p><ul><li>Price: 500 → 400</li><li>[Removed] 5 Ability Haste&nbsp;</li></ul><h4>Items Removed</h4><ul><li>Like Shimmering Spark, with the new jungle system, we no longer need a jungle-specific version of Sunfire Aegis.<ul><li>Searing Crown</li></ul></li><li>Surging Scales has always struggled to find a clear identity. Its underwhelming stats and effect haven't done enough to differentiate it from Chain Vest, so it's time to say goodbye.<ul><li>Surging Scales</li></ul></li><li>Stinger has also lost its last remaining user, so we're removing it for now.<ul><li>Stinger</li><li>See above.</li><li>Searing Crown</li></ul></li></ul>"}}, {"type": "separator"}, {"type": "articleRichText", "richText": {"body": "<h2>RUNE ADJUSTMENTS</h2><h4>Lethal Tempo</h4><p>Lethal Tempo has been providing too much Attack Speed and bonus range on its own, creating some extreme power swings for marksmen throughout the game. Alongside our marksman item updates, we’re reworking the rune to rely more on synergy with other Attack Speed sources rather than providing so much power by itself. This should make Lethal Tempo a more natural fit for champions who invest heavily in Attack Speed, while keeping its power more consistent and easier to control.</p><ul><li>Landing basic attacks on enemy champions grants stacking Attack Speed, 8% for melee and 6.4% for ranged, up to 6 stacks for 6 seconds. At max stacks, attacks also fire a bullet that deals adaptive damage, 9 - 30 for melee and 6 - 24 for ranged. Each 1% bonus Attack Speed increases this damage by 1% for melee and 0.67% for ranged.</li></ul><h4>Conqueror</h4><p>We've standardized Conqueror's Attack Damage and Ability Power scaling.&nbsp;</p><ul><li>Stats granted per stack: 3–5 Bonus Attack Damage / 4–8 Ability Power (1.25x–1.6x) -&gt; 3–5 Bonus Attack Damage / 5–8.33 Ability Power (standardized to 1.667x)&nbsp;</li></ul><h4>Legend: Haste&nbsp;</h4><p>With Mercury’s Treads now providing a significant amount of Tenacity, having additional Tenacity readily available through runes can make crowd control too easy to shrug off. We want Tenacity to remain a more deliberate investment so champions who rely on crowd control can still do their jobs. As a result, we’re replacing Legend: Tenacity with Legend: Haste.</p><ul><li>Replaces Legend: Tenacity</li><li>Takedowns and killing monsters and minions grant Ability Haste, up to a maximum of 15 Ability Haste, with each stack granting 1.5 Ability Haste.</li></ul><h4>Demolish&nbsp;</h4><p>To align with turret-related changes such as Crystalline Overgrowth, we're making corresponding adjustments to Demolish. See Battlefield Adjustments for details.&nbsp;</p><ul><li>After hitting a turret with 3 basic attacks, melee champions deal 85 + 28% maximum Health bonus Physical Damage, while ranged champions deal 50 + 20% maximum Health bonus Physical Damage.&nbsp;</li></ul><h4>Ingenious Hunter&nbsp;</h4><p><strong>Ingenious Hunter</strong> has created some overly powerful synergies with certain items, while barely making an impact with others. To keep the item system in a healthier spot, we’re removing Ingenious Hunter for now. Don’t worry, hunters, we’ll bring it back when the time is right.</p><ul><li>Removed</li></ul><p>Legend: Tenacity</p><ul><li>Removed</li></ul><h2>BATTLEFIELD ADJUSTMENTS</h2><h3>Jungle Adjustments</h3><p>We’re making a broad set of changes to the jungle this patch, with a few key goals: increase champion diversity, bring clear speeds closer together across different types of junglers, protect jungle resources from laners, and give non-carry junglers more ways to help their team win.</p><p>First, we’re shifting a significant portion of the bonus damage junglers deal to monsters with basic attacks and abilities into a persistent burn. This burn benefits from a wider range of stats, allowing fighters, mages, tanks, and other junglers to improve their clear speeds naturally through their builds. Tank junglers, for example, should no longer feel as pressured to build items like Sunfire Aegis just to keep up their clear.</p><p>We’re also adjusting the jungle economy. Monsters will grant less base Gold, with more of that Gold shifted into the bonus provided by Smite. At the same time, monsters will be tougher and deal more damage to non-junglers. Together, these changes should make jungle resources harder for laners to take while keeping them valuable for the jungler.</p><p>Monster levels will now scale based on the average level of both teams rather than game time. This should keep monster durability more consistent with the state of the match, instead of allowing them to become excessively tanky or squishy.</p><p>We’re also moving the jungle healing effect from casting Smite to killing monsters, aligning healing more closely with when junglers receive their Gold and experience.</p><p>Epic monsters are getting some attention too. We want major objectives to be worth fighting over without disappearing before teams have a chance to contest them, so we’re standardizing their durability and increasing Baron Nashor’s mid-game rewards. Alongside our turret and minion changes, securing an early Baron should give teams, especially those with non-carry junglers, a more reliable opportunity to turn that advantage into meaningful map pressure.</p><p>And finally, we’re giving junglers a little more control when it matters most: Smite is getting stronger. Smite will now upgrade twice as you consume reward stacks, eventually reaching one thousand four hundred damage. Combined with increased monster resistances, this should make objectives harder for non-junglers to steal and give junglers a bit more reliability in those high-pressure objective fights.</p><h4>Smite Adjustments</h4><ul><li>[New] Champions with Smite deal 30-225 (Scale with Level) + 10% Bonus Attack Damage + 12% Ability Power + 20% Bonus Armor + 20% Bonus Magic Resistance + 3% Bonus Health True damage. After you stop attacking, this damage continues up to 2 more times. Champions also heal for 5 - 35 each second, scaling with champion level.</li><li>[Removed] Champions with Smite deal bonus ability and basic attack damage to monsters.</li><li>[New] Non-epic monsters deal 50% damage to champions with Smite.</li><li>[Removed] Casting Smite restores Health.</li><li>[New] Killing a large monster restores 100–260 Health to the killer (scales with monster level, reaching the maximum at level 9).</li></ul><h4>Jungle Economy Adjustments</h4><p>[Removed] Monster gold scaling.</p><p>Eco Protection adjustments:</p><ul><li>Champions with Smite gain 1 stack every 20 seconds. Consuming 1 stack when clearing a monster camp grants an additional 45 gold, stacking up to 3 times.</li><li>Catch-up mechanic: when your team's total gold is below 90% of the enemy team's total gold and your own gold is less than or equal to 95% of your team's average gold, consuming 1 stack grants 70 gold.</li></ul><p>Jungler minion penalty:</p><ul><li>Champions with Smite gain 30% - 100% of lane experience, increasing over time once per minute and reaching 100% at 15 minutes.</li><li>If a jungler gains more than 40% as much gold from lanes as from monsters, gold and experience gained from lanes are reduced by 50%. This effect stacks with the previous rule and is removed at 12 minutes.</li></ul><p>Lane champion jungling penalty:</p><ul><li>Champions without Smite gain only 50% - 80% experience from monsters, increasing over time once per minute and reaching 80% at 12 minutes.</li></ul><h4>Smite Upgrade Rules</h4><ul><li>Initial damage: 600 true damage</li><li>Upgrade Smite by consuming Eco-system Protection stacks.</li><li>Consume 8 total stacks.<ul><li>Upgrade to 1000 true damage.</li></ul></li><li>Consume 20 total stacks.<ul><li>Upgrade to 1400 true damage.</li><li>Afterward, gain 1 Eco-system Protection stack every 30 seconds.</li><li>Gain 5% bonus Movement Speed in the jungle and river, increased to 10% while out of combat.</li><li>Gain an additional 20 bonus gold from each jungle camp.</li></ul></li></ul><h4>Jungle Monster Rules</h4><p>Monster stat growth no longer increases with time and instead scales with the average level of all champions on the map.</p><p>Epic jungle monster stats:</p><ul><li>Elemental Dragons (levels 5 - 15):<ul><li>Health 4900 - 10900, Attack Damage 70, Armor 59 - 119, Magic Resistance 41 - 81</li></ul></li><li>Rift Herald (levels 5 - 15):<ul><li>Health 7100 - 11100, Attack Damage 100 - 200, Armor 79 - 139, Magic Resistance 52 - 82</li></ul></li><li>Summoned Rift Herald (levels 5 - 15):<ul><li>Health 5300 - 7300, Attack Damage 80 - 130, Armor 54 - 114, Magic Resistance 32 - 62</li><li>Gold granted when the Summoned Rift Herald charges: 200 → 50</li></ul></li><li>Baron Nashor (levels 9 - 15):<ul><li>Health 14000 - 18500, Attack Damage 280 - 490, Armor 96 - 168, Magic Resistance 56 - 98</li><li>Basic attacks and abilities that hit enemy champions apply a debuff that reduces Armor and Magic Resistance by 0.5, stacking up to 100 times and lasting 8 seconds. Basic attacks add 1 stack, and abilities add 2 stacks.</li><li>Energy Surge Attack Damage ratio: 60% → 30%</li><li>Corrosive Fluid Attack Damage ratio: 100% → 50%</li><li>Sundering Breath Attack Damage ratio: 200% → 100%</li><li>Spike Burst Attack Damage ratio: 100% → 50%</li></ul></li><li>Elder Dragon (levels 11 - 15): Health 19000 - 20200, Attack Damage 105, Armor 150 - 170, Magic Resistance 95 - 107</li></ul><p>Jungle monster stats (levels 1 - 15):&nbsp;</p><ul><li>Krugs:<ul><li>Health 1300 - 3050, Attack Damage 60 - 172, Armor 40, Magic Resistance 35</li></ul></li><li>Mini Krugs:<ul><li>Health 550 - 1560, Attack Damage 20 - 62, Armor 20, Magic Resistance 20</li></ul></li><li>Gromp:<ul><li>Health 1800 - 4390, Attack Damage 55 - 160, Armor 40, Magic Resistance 35</li></ul></li><li>Blue Sentinel:<ul><li>Health 2200 - 4650, Attack Damage 70 - 210, Armor 40, Magic Resistance 35</li></ul></li><li>Red Brambleback:<ul><li>Health 2200 - 4650, Attack Damage 70 - 210, Armor 40, Magic Resistance 35</li></ul></li><li>Crimson Raptor:<ul><li>Health 1000 - 2540, Attack Damage 20 - 55, Armor 40, Magic Resistance 35</li></ul></li><li>Raptors:<ul><li>Health 500 - 1270, Attack Damage 10 - 24, Armor 20, Magic Resistance 20</li></ul></li><li>Greater Murk Wolf:<ul><li>Health 1200 - 3230, Attack Damage 30 - 93, Armor 40, Magic Resistance 35</li></ul></li><li>Murk Wolves:<ul><li>Health 600 - 1510, Attack Damage 10 - 31, Armor 20, Magic Resistance 20</li></ul></li><li>Rift Scuttler:<ul><li>Health 1500 - 3600, Armor 40, Magic Resistance 40</li><li>The first spawn has been moved to 1: 30.</li></ul></li></ul><p>New jungle monster traits:</p><ul><li>Krugs, Crimson Raptors, and Greater Murk Wolves deal bonus physical damage equal to 3% of the target's current Health on attack.</li><li>Gromp, Red Brambleback, and Blue Sentinel deal bonus physical damage equal to 5% of the target's current Health on attack.</li></ul><h3>Battlefield system Adjustments</h3><h4>Turrets</h4><p>This season, we’re making some changes to turrets to create a smoother transition out of the laning phase and make every push feel like meaningful progress.</p><p>First, all turrets will now have plating, and turret plating will no longer disappear at six minutes. We’re also increasing turret Health across the board. Previously, once plating disappeared, a single mistake could quickly turn a full-Health turret into rubble and abruptly bring the laning phase to an end. Keeping plating around longer should make that transition more gradual while giving you a consistent reward for pushing, even when you can’t take the entire turret.</p><p>The additional durability should also make it harder to take multiple plates in a single push, while creating more opportunities to chip away at turrets throughout the game.</p><p>We’re also introducing&nbsp;<strong>Crystalline Overgrowth</strong>, a new mechanic that gives every champion a way to make meaningful progress against turrets, even if they aren’t running Demolish or building specifically for split-pushing.</p><p>Over time, crystals will accumulate on turrets. When a champion attacks a turret, the accumulated crystals shatter and deal bonus True Damage based on how much Crystalline Overgrowth has built up. This damage doesn’t depend on the attacker’s stats, and you won’t need to hang around the turret for an extended period to take advantage of it.</p><p>Think of it as a mini push waiting for you. Whether you’re constantly pressuring a side lane or only find a brief window to sneak in a few attacks, Crystalline Overgrowth should help those moments make a meaningful dent in the turret.</p><h4>Crystalline Overgrowth</h4><ul><li>All attackable lane turrets are now affected by Crystalline Overgrowth.</li><li>Turrets crystallize over time. A champion's first basic attack detonates all accumulated crystals, dealing True Damage.</li><li>The higher the average level of the attacking team, the higher the crystal detonation damage.</li><li>Cooldown: After a turret spawns, Crystalline Overgrowth has a 50-second cooldown. Once the cooldown ends, crystals begin to accumulate.</li><li>Crystalline Overgrowth remains at its minimum damage for 30 seconds, then scales linearly over 160 seconds until reaching its maximum damage, where it remains indefinitely.</li><li>Minimum damage: 2%–8.7% of the turret's maximum Health (based on the attacking team's level)</li><li>Maximum damage: 3.3%–18.9% of the turret's maximum Health (based on the attacking team's level)</li><li>If an enemy champion is near the turret at the 50-second mark, when Crystalline Overgrowth would normally activate, crystal growth is temporarily suppressed and will not appear. Once all enemy champions leave the area, the crystals will begin to appear and \"fast-forward\" to the stage they would have reached, making up for the suppressed progress. This is intended to prevent Crystalline Overgrowth from suddenly activating in the middle of a push.</li><li>While the outer turret is still standing, the inner turret and inhibitor turret will not crystallize. Once the outer turret is destroyed, the inner turret begins crystallizing.</li><li>When no minions are within turret range and the turret's damage reduction is active, the crystals cannot be detonated.</li></ul><h4>Turret Related Adjustments</h4><h5>Turret Adjustments</h5><ul><li>All Turrets<ul><li>[New] All turrets take 20% increased damage from melee champions.</li><li>Turret plating distribution: Outer turrets, inner turrets, and inhibitor turrets.</li><li>Turret plating now persists permanently.</li><li>Turret plates are tied to Health thresholds. A turret loses 1 plate whenever its Health falls below 90%, 75%, 55%, 30%, and 0%.</li><li>[Removed] When an outer/inner turret is destroyed, the corresponding inner/inhibitor turret no longer gains a 30-second shield.</li><li>[Removed] During the first 2 minutes of the game, Baron Lane and Mid Lane turrets no longer gain 50 bonus Armor and Magic Resist.</li><li>[Removed] During the first 6 minutes of the game, outer turrets no longer gain Armor and Magic Resist based on their remaining Health.</li><li>[Removed] During the first 5 minutes of the game, turrets no longer gain bonus stats when multiple enemy champions are within their attack range.</li><li>[New] Starting at 5:00, outer turret Armor, Magic Resistance, and turret plate Gold rewards begin to decay, up to 4 times.<ul><li>Turret plate Gold: -10 every 30 seconds, down to a minimum of 100 Gold</li><li>Armor and Magic Resist: -15 every 30 seconds, down to a minimum of 0</li></ul></li><li>Whenever a turret plate is destroyed, the turret gains 30 Armor and Magic Resist for 20 seconds. Destroying another plate refreshes the duration. During this time, the turret gains an additional 5 Armor and Magic Resist for each enemy champion within 850 range</li></ul></li><li>Turret Stats<ul><li>Health:<ul><li>Outer turret: 3000 → 7000</li><li>Inner turret: 3000 → 4500</li><li>Inhibitor turret: 3200 → 4250</li></ul></li><li><strong>[</strong>Adjusted] Armor and Magic Resist: 60</li><li>[Removed] Gold granted for destroying turrets</li><li>[Adjusted] Turret Plating and Turret Rewards:<ul><li>Outer turret: 140 Gold per plate, 700 Gold total</li><li>Inner and inhibitor turrets: 120 Gold per plate, 600 Gold total</li><li>First turret: 150 bonus Gold</li><li>Global bounty for destroying an outer turret: 50 Gold per player</li><li>Global bounty for destroying an inner or inhibitor turret: 25 Gold per player</li></ul></li></ul></li></ul><h3>Battlefield Tempo Adjustments</h3><p>As part of our broader jungle and objective changes, we’re also updating Hand of Baron to make empowered minion waves more impactful and give each minion type a clearer role when pushing. We’re changing the Attack Damage granted to empowered minions from a percentage increase to a flat value. This should make early Baron takes more rewarding while keeping the buff from scaling too heavily later in the game. Empowered minions will also now have a minimum Movement Speed, preventing powerful Slow effects from bringing Baron-empowered pushes to a crawl.</p><p><strong>Hand of Baron</strong></p><ul><li>Melee Minions:<ul><li>Reduced damage from champions: 50% - 70% (11:00 - 25:00)</li><li>Reduced damage from minions: 80%</li><li>Attack Damage increase: 10</li><li>Reduced damage from turrets: 25%</li></ul></li><li>Caster Minion:<ul><li>Reduced damage from champions: 50% - 70% (11:00 - 25:00)</li><li>Reduced damage from minions: 20%</li><li>Attack Damage increase: 30</li><li>Reduced damage from turrets: 25%</li></ul></li><li>Siege Minions:<ul><li>Reduced damage from champions: 30%</li><li>Reduced damage from minions: 20%</li><li>Attack Damage increase: 100</li><li>Reduced damage from turrets: 25%</li></ul></li><li>Cannon Minions:<ul><li>Reduced damage from champions: 30%</li><li>Reduced damage from minions: 20%</li><li>Attack Damage increase: 100</li><li>Reduced damage from turrets: 25%</li></ul></li><li>Super Minions:<ul><li>Super Minions are not affected by Hand of Baron.</li></ul></li><li>All Minions:<ul><li>Minions empowered by Hand of Baron now have a minimum Movement Speed of 3.3.</li></ul></li></ul><h4>Minions&nbsp;</h4><p>Minions are also getting some updates this patch. We want teams that successfully break through an inhibitor turret to be better rewarded for maintaining pressure, allowing empowered waves to steadily build advantages and wear down the enemy team over time. We’re also changing the mid- and late-game minion acceleration effect from out-of-combat Movement Speed to persistent Movement Speed. This should help waves push more consistently later in the game and reduce awkward gaps between them.</p><h4>Super Minion Aura</h4><p>Super Minions empower nearby minions based on the number of enemy inhibitor turrets destroyed.</p><ul><li>1 Turret:<ul><li>35 Armor, 35 Magic Resistance</li></ul></li><li>2 Turrets:<ul><li>35 Armor, 35 Magic Resistance</li><li>Attack Damage: 15%</li></ul></li><li>3 Turrets:<ul><li>35 Armor, 35 Magic Resistance</li><li>Attack Damage: 40%</li></ul></li></ul><p>[Removed] Super Minions no longer benefit from the Super Minion Aura.</p><h4>Minion Stats&nbsp;</h4><p><strong>Super Minions</strong></p><ul><li>Base Health: 800 → 1100</li></ul><p><strong>Cannon Minions</strong></p><ul><li>Damage to structures: Reaches a maximum of 100% at 23:00 → Fixed at 84%</li></ul><p><strong>All Minions&nbsp;</strong></p><ul><li>[New] All minions deal 60% damage to champions.</li><li>[New] Starting at 5:30, minions gain 25 Movement Speed every 150 seconds, up to 6 times.</li><li>[Removed] Starting at 11:00, minions no longer gain 10% out-of-combat Movement Speed per minute.</li><li>Minion experience range: 8 → 10</li></ul><h4>Minion Push Buffs</h4><p>The team with the higher total level and a turret advantage in the lane gains a Minion Push Advantage:&nbsp;</p><ul><li>[New] Bonus damage to minions: (5% + (5% × turret advantage in the lane)) × team average level advantage</li><li>[New] Damage reduction against minions: 1 + (turret advantage in the lane × team average level advantage)</li></ul><h3>Lifesteal</h3><p>We’re introducing Lifesteal, a new vamp stat that applies only to basic attacks, on-hit damage, and abilities treated as basic attacks. This gives marksmen a more focused source of sustain that rewards their basic attacks without allowing abilities to generate excessive healing. We also want vamp to remain a relatively scarce source of power. Some champions are defined by their access to strong sustain, and making similar levels of healing too easy for everyone to access can diminish that strength while creating difficult balance cases. Lifesteal gives us a clearer way to separate basic attack-focused sustain from other forms of vamp and reduce the overall availability of broad healing across the game.</p><ul><li>This stat has replaced the previous vamp effects on the following items. See the item sections for details: Mercurial Scimitar, Vampiric Scepter, Bloodthirster, Blade of the Ruined King, and Gunmetal Greaves.&nbsp;</li></ul>"}}, {"type": "separator"}, {"type": "articleRichText", "richText": {"body": "<h3>OTHER IN-GAME ADJUSTMENTS</h3><h3>Training Camp</h3><ul><li>You can now interact with the shop from anywhere in Practice Mode, including buying items, undoing purchases, and selling items.</li></ul><h3>Custom Mode</h3><ul><li>Added a new custom game mode:&nbsp;<strong>Rift Trials</strong>, where two players face off in a 1v1 on the Baron Lane of Summoner's Rift.&nbsp;</li></ul><h3>Summoner’s Rift</h3><ul><li>When players are within the item purchase area at their base, the Gold display will now be highlighted.</li><li>Item price differences can now be displayed while within the base.</li><li>When an Elemental Dragon is about to spawn, its shadow can be seen circling above its spawn location.</li></ul><h3>In-Game Key Item Recommendations</h3><p>We have introduced the Battlefield Smart Counter Assistant. Based on the enemy team composition and build traits, the system recommends key counter items for the current match and explains why, helping players make better item decisions.</p><h2>Adventure Mode</h2><h3>Battlefest S7</h3><p>Battlefest Season 7 kicks off on September 23 at 03:00 UTC, bringing a fresh round of fun modes and new rewards!This season features four chromas for Purple Garlic Lulu, along with exclusive skin icons, borders, and more goodies to earn. We’re also updating hidden chroma rewards: when claiming one, you’ll now be able to choose between the base skin or the hidden chroma, so you won’t end up with a chroma for a skin you don’t own. Time to Battlefest!</p><h3>AAA ARAM</h3><p><meta></p><p>Welcome to the “Sonic Waves” Season of AAA ARAM!&nbsp;</p><h4>Themed Augments</h4><p>With this update, we're introducing several new Augment sets, including Heartsteel and True Damage. Augments within the same set generally have stronger synergies with one another, and their effects typically become more powerful as you collect more Augments from the same set.&nbsp;</p><h4>Heartsteel</h4><p>Earn “Steelbuff” through various means. For every 100 Steel Tokens collected, you can open a chest containing Gold, Anvils, and bonus Augments. The more Heartsteel Augments you have, the more Steelbuff you'll gain each time.&nbsp;</p><h4>True Damage</h4><p>Your attacks deal bonus True Damage. As you collect more True Damage Augments, the Duet Augment will further increase all True Damage you deal, up to a maximum increase of 100%.&nbsp;</p><h4>Rock ‘n’ Pentakill</h4><p>Significantly increases your champion's sustained combat power. When a champion holding these Augments scores a pentakill, a unique pentakill celebration will play. The more Augments from this set you have, the more spectacular the celebration becomes.&nbsp;</p><p>We've also balanced the power of collecting Augments from the same set, so the individual strengths of each Augment won't be overshadowed by these set effects.&nbsp; For more information on the new Augments, check the Augment Archive after the update.&nbsp;</p><h3>Sonic Waves Season Theme</h3><p>Augment visuals and selection sound effects have been redesigned. Music-themed Augments feature unique animated champion card art, with their effects generally inspired by the champions featured on the cards.&nbsp;</p><h3>New Items&nbsp;</h3><h4>Endless Hunger</h4><p>If a champion you've damaged within the last 3 seconds dies, gain 15% Omnivamp for 8 seconds. This effect can stack.&nbsp;</p><h4>Profane Hydra</h4><p>Attacks deal area damage to nearby enemies. Empowered basic attacks deal additional area damage.&nbsp;</p><h4>Elixir of Iron</h4><p>Increases Health and Tenacity.&nbsp;</p><h4>Elixir of Sorcery</h4><p>Increases Ability Power and Mana regeneration, and allows you to deal bonus True Damage.&nbsp;</p><h4>Elixir of Wrath</h4><p>Increases Attack Damage and Physical Vamp.&nbsp;</p><h4>Augment pool Adjustments</h4><p>We've optimized the Augment pool so champions can more easily find Augments that suit their needs. We'll continue improving the system to minimize Augments that provide little practical value. As a result, some champions will initially have fewer Augments available from certain themed Augment sets. Once you select any Augment from a set, the remaining Augments from that set will become available.</p><h4>Augments Adjustments</h4><p>We've improved the values provided by several Augments to make them more competitive, including True Damage, Witchful Thinking, and more.</p><h2>SYSTEM</h2><h3>NEW SYSTEM</h3><h3>New Season Begins&nbsp;</h3><p>Ranked &amp; Legendary Ranked Evaluation System</p><p>Combat stats like KDA have historically played a large role in determining S/A ratings and MVP, but they don’t always tell the full story of how much a player contributed to their team.</p><p>We’re trialing a new evaluation system in Ranked and Legendary Ranked that better accounts for the different ways champions and roles can contribute to a match. We’ll continue monitoring its performance and making adjustments based on your feedback.</p><ol><li>Adjusted the S/A rating algorithm. Ratings will still be based on comparisons with other players using the same champion, but will now incorporate more data related to role responsibilities and team contributions. The weighting of evaluation parameters will also be optimized based on the responsibilities of each role, allowing ratings to more accurately reflect the performance of different champion types and players.</li><li>Optimized the MVP selection algorithm to more comprehensively evaluate the responsibilities and contributions of different roles, making MVP results better reflect players' actual contributions.</li><li>Added a new rating above S: Legendary S. Players who earn a Legendary S rating will also receive additional Ranked Fortitude.</li><li>Updated the post-game evaluation interface for Ranked and Legendary Ranked to provide a clearer and more comprehensive overview of player performance.</li><li>These evaluation system changes only apply to Ranked and Legendary Ranked.</li></ol><h3>Legendary Ranked&nbsp;</h3><p>We’re updating Legendary Ranked to encourage more high-skill players to join the competition and help you reach the level that best reflects your skill more quickly. We’re adjusting entry requirements, progression, and the point system to make the climb smoother and more rewarding.</p><ol><li>Lowered entry requirements: Players who reach Master this season, or reached Grandmaster or above last season, can participate in Legendary Ranked when it is available now.</li><li>Added the Legendary Trial event. Perform well and complete the designated challenges to advance directly to Legendary Master.</li><li>Added provincial Legendary Ranked leaderboards, giving high-skill players more opportunities to showcase their skills and compete for recognition.</li><li>Adjusted the point system at higher ranks. Once players reach higher ranks, they'll need to maintain a higher win rate to continue climbing, further increasing the competitive value of high ranks.</li></ol><h3>Champion Score System Update&nbsp;</h3><p>We’re updating Champion Score to better reflect your skill and competitive performance with each champion, while reducing the impact of score manipulation and intentional losses.</p><p>Our goal is to let you focus on climbing in Legendary Ranked without worrying as much about losing Champion Score or feeling pressured to pick a specific champion just to increase their score. Your champion choice should be about what gives your team the best chance to win—not protecting a number.</p><ol><li>Removed Legendary Ranked Performance Score, while retaining the Legendary Ranked Multiplier. The higher your Legendary Ranked tier, the higher your multiplier will be. The value of the Legendary Ranked Multiplier has also been significantly increased.</li><li>Added a champion unlock mechanic for the Legendary Ranked Multiplier. Players must accumulate net wins with a champion to gradually unlock that champion's Legendary Ranked Multiplier.</li><li>Champion Record Score will no longer decrease after a loss. Except in cases involving rule violations, Champion Record Score can only increase.</li><li>Champion Performance Score has been changed to Ranked Performance Score. After this adjustment, this score can only be earned through Ranked matches.</li><li>Corresponding multipliers and values for the Legendary Ranked Challenge have also been optimized.</li><li>Removed the previous Season Inheritance Score Bonus and added the new Master of Versatility Score Bonus.</li></ol><h3>Priority Role Bonus</h3><p>We’re introducing a new<strong> Priority Role Bonus</strong> to help maintain a healthier role distribution in Ranked. Players who choose roles that are currently in higher demand will receive additional rewards, giving you a little something extra for stepping up where your team needs it most.</p><ol><li>The Priority Role Bonus applies to Ranked matches from Platinum through Challenger.</li><li>Bonus points earned through the Priority Role Bonus count toward the weekly cap for performance bonus points.</li><li>Eligible roles will be adjusted each season based on player role preferences and the overall matchmaking environment. Refer to the in-game display for the current eligible roles. This season's bonus roles are Support, Jungle, and Any Position.</li><li>Any Position will no longer count toward the Autofill Bonus. In Ranked, it will instead use the Priority Role Bonus system.</li><li>The regular Autofill Bonus in Legendary Ranked will remain unchanged.</li></ol><h3>Champion Ban Rule Adjustments</h3><p>We’re expanding the five-ban system to more ranks, creating a more consistent Pick/Ban experience while giving teams more room to make strategic choices around champion picks and team compositions.</p><ol><li>Ranked matches from Platinum through Diamond will change from 3 bans per team to 5 bans per team.</li><li>Removed the restriction that only enabled the 5-ban system two weeks after the start of a new season. Eligible Ranked matches will now use the 5-ban system immediately when the new season begins.</li></ol><h4>Teammate Augment Recommendation&nbsp;</h4><p>If you're having trouble deciding which Augment to choose, you can ask your premade teammates for recommendations.&nbsp;</p><h3>New Player Rewards Revamped</h3><p>We’re combining the 8-Day New Player Login and Special Offer events into a single interface, making it easier for new players to find and claim their rewards in one place. If you unlocked New Player Rewards before this update, don’t worry! Your existing reward progress and remaining event duration will carry over automatically, so you won’t miss out on anything.</p>"}}, {"type": "separator"}, {"type": "articleRichText", "richText": {"body": "<h2><meta>BUG FIXES</h2><ul><li>Fixed an issue where slows were removed outright if the target became Unstoppable or crowd-control immune after the slow was applied. Now the slow does not take effect during that state, but its timer continues normally, and once the state ends the slow applies again.</li><li>Fixed an issue where Sivir's (2) Ricochet could trigger the Red Brambleback buff.</li><li>Fixed an issue where the description for Heimerdinger's (1) was missing the information that melee champions deal bonus damage to turrets.</li><li>Fixed an issue where Wukong's (4) would occasionally knock up targets an additional time.</li><li>Fixed an issue where the duration of the damage reduction from Warwick's (3) ability would occasionally be abnormal when activated early.</li></ul>"}}, {"type": "separator"}, {"type": "articleRichText", "richText": {"body": "<h2>Appendix</h2><h3>Champion Durability Adjustments Detailed List</h3><h4>Garen</h4><p><i>Base Stats</i></p><ul><li>Base Health: 660 → 690</li><li>Base Armor: 52 → 44</li><li>Armor per Level: 5.8 → 5</li></ul><h4>Aatrox</h4><p><i>Base Stats</i></p><ul><li>Armor per Level: 4.5 → 5</li><li>Base Magic Resist: 40 → 36</li></ul><h4>Rengar</h4><p><i>Base Stats</i></p><ul><li>Base Health: 660 → 630</li><li>Health per Level: 128 → 136</li></ul><h4>Amumu</h4><p><i>Base Stats</i></p><ul><li>Health per Level: 104 → 114</li></ul><h4>Nunu &amp; Willump</h4><p><i>Base Stats</i></p><ul><li>Base Health: 690 → 630</li><li>Health per Level: 120 → 124</li></ul><h4>Ekko</h4><p><i>Base Stats</i></p><ul><li>Base Health: 630 → 650</li><li>Health per Level: 120 → 126</li></ul><h4>Kha’Zix</h4><p><i>Base Stats</i></p><ul><li>Base Health: 630 → 640</li><li>Health per Le Stats</i></p><ul><li>Base Health: 660 → 630</li><li>Health per Level: 128 → 138</li></ul><h4>Lee Sin</h4><p><i>Base Stats</i></p><ul><li>Base Health: 690 → 660</li><li>Health per Level: 120 → 132</li></ul><h4>Kennen&nbsp;</h4><p><i>Base Stats</i></p><ul><li>Base Health: 660 → 600</li><li>Health per Level: 120 → 130</li></ul><h4>Dr. Mundo</h4><p><i>Base Stats</i></p><ul><li>Base Health: 720 → 680</li><li>Health per Level: 112 → 120</li></ul><h4>Rammus</h4><p><i>Base Stats</i></p><ul><li>Base Health: 690 → 670</li><li>Base Armor: 49 → 45</li><li>Health per Level: 112 → 124</li></ul><h4>Zeri</h4><p><i>Base Stats</i></p><ul><li>Base Health: 630 → 600</li><li>Health per Level: 128 → 136</li></ul><h4>Master Yi</h4><p><i>Base Stats</i></p><ul><li>Health per Level: 120 → 130</li></ul><h4>Yone</h4><p><i>Base Stats</i></p><ul><li>Base Health: 650 → 630</li><li>Health per Level: 120 → 130</li></ul><h4>Darius</h4><p><i>Base Stats</i></p><ul><li>Base Health: 650 → 660</li><li>Base Armor: 52 → 45</li><li>Health per Level: 144 → 148</li></ul><h4>Alistar</h4><p><i>Base Stats</i></p><ul><li>Base Health: 720 → 700</li></ul><h4>Aurora</h4><p><i>Base Stats</i></p><ul><li>Health per Level: 120 → 132</li></ul><h4>Kassadin</h4><p><i>Base Stats</i></p><ul><li>Base Health: 630 → 650</li><li>Health per Level: 120 → 132</li></ul><h4>Graves</h4><p><i>Base Stats</i></p><ul><li>Base Health: 660 → 630</li><li>Health per Level: 128 → 136</li></ul><p><meta></p><h4>Poppy</h4><p><i>Base Stats</i></p><ul><li>Base Health: 660 → 630</li><li>Health per Level: 128 → 136</li></ul><h4>Draven</h4><p><i>Base Stats</i></p><ul><li>Base Health: 630 → 650</li><li>Health per Level: 128 → 132</li></ul><h4>Malphite</h4><p><i>Base Stats</i></p><ul><li>Health per Level: 120 → 130</li></ul><h4>Gragas</h4><p><i>Base Stats</i></p><ul><li>Base Health: 720 → 660</li><li>Health per Level: 120 → 140</li></ul><h4>Riven&nbsp;</h4><p><i>Base Stats</i></p><ul><li>Base Health: 690 → 660</li><li>Health per Level: 120 → 125</li><li>Base Armor: 46 → 43</li></ul><h4>Irelia</h4><p><i>Base Stats</i></p><ul><li>Base Health: 690 → 660</li><li>Health per Level: 128 → 138</li></ul><h4>Katarina</h4><p><i>Base Stats</i></p><ul><li>Base Health: 630 → 660</li></ul><h4>Skarner</h4><p><i>Base Stats</i></p><ul><li>Base Health: 690 → 660</li><li>Health per Level: 128 → 132</li></ul><h4>Shen</h4><p><i>Base Stats</i></p><ul><li>Health per Level: 112 → 124</li></ul><h4>Galio</h4><p><i>Base Stats</i></p><ul><li>Base Health: 660 → 630</li><li>Health per Level: 144 → 148</li></ul><h4>Lissandra</h4><p><i>Base Stats</i></p><ul><li>Health per Level: 120 → 130</li></ul><h4>Senna</h4><p><i>Base Stats</i></p><ul><li>Base Health: 600 → 570</li></ul><h4>Nautilus</h4><p><i>Base Stats</i></p><ul><li>Base Health: 720 → 690</li></ul><h4>Thresh</h4><p><i>Base Stats</i></p><ul><li>Health per Level: 120 → 140</li></ul><h4>Ornn</h4><p><i>Base Stats</i></p><ul><li>Base Health: 720 → 690</li><li>Health per Level: 120 → 132</li></ul><h4>Nocturne</h4><p><i>Base Stats</i></p><ul><li>Health per Level: 120 → 134</li></ul><p>In Patch 7.3, we made fairly major changes to Attack Speed, so we also want to take this opportunity to fully explain how Attack Speed works. Attack Speed is the stat that determines how often a unit can perform basic attacks. For a champion, Attack Speed can mainly be broken down into the following types:</p><ol><li>Base Attack Speed<ol><li>Base Attack Speed is a champion's starting Attack Speed and usually also determines that champion's Attack Speed Ratio.</li></ol></li><li>Attack Speed Ratio<ol><li>Attack Speed Ratio determines how efficiently a champion converts bonus Attack Speed into actual Attack Speed. It converts the bonus Attack Speed a champion gains into real Attack Speed based on a percentage. In most cases, a champion's Attack Speed Ratio is equal to their Base Attack Speed.</li></ol></li><li>Base Bonus Attack Speed<ol><li>Base Bonus Attack Speed is the bonus Attack Speed a champion has as soon as the match begins, and it does not scale with champion level. This means a champion's Attack Speed at level 1 is determined jointly by their Base Attack Speed and Base Bonus Attack Speed.</li></ol></li><li>Attack Speed per Level<ol><li>Attack Speed per Level is the Attack Speed a champion gains as they level up, and it is also treated as bonus Attack Speed in these calculations. (By contrast, other per-level stats, such as Attack Damage per Level, are not treated as bonus Attack Damage and are instead calculated as part of base Attack Damage.) Although Attack Speed per Level is a fixed value, the amount of bonus Attack Speed a champion gains each level is not equal. Bonus Attack Speed gained from leveling each level = Attack Speed per Level ×(0.7 + 0.04 × current level). For example, when a champion levels from 1 to 2, the bonus Attack Speed gained is equal to 74% of their Attack Speed per Level. By max level, the total bonus Attack Speed a champion gains from leveling = 1400% × Attack Speed per Level.</li></ol></li></ol><p>Next, we'll take a closer look at how Attack Speed is calculated. Let's start with a few formulas:</p><ul><li>Total Attack Speed = Base Attack Speed + Attack Speed Ratio × Bonus Attack Speed Bonus Attack Speed = Base Bonus Attack Speed + bonus Attack Speed gained from leveling + bonus Attack Speed gained from other sources such as items, runes, and abilities</li></ul><p>Let's use Caitlyn as an example and plug the numbers into the formulas: &nbsp;</p><ul><li>For Caitlyn, both her Base Attack Speed and Attack Speed Ratio are 0.625, her Base Bonus Attack Speed is 0.28, and her Attack Speed per Level is 0.04.</li><li>At level 1, without any extra items or runes, Caitlyn's only bonus Attack Speed comes from her Base Bonus Attack Speed. So Caitlyn's Attack Speed = Base Attack Speed + Attack Speed Ratio × Base Bonus Attack Speed = 0.625 + 0.625 × 0.28 = 0.8 Assume Caitlyn is at max level, has a fully stacked rune - Legend: Alacrity (granting 18% bonus Attack Speed), and has equipped Berserker's Greaves (granting 35% bonus Attack Speed). Her Attack Speed can then be calculated as follows: 0.625 + 0.625 × (0.28 + 0.04 × 14 + 0.18 + 0.35) = 1.48125. On the stats panel, Attack Speed is displayed with two decimal places: 1.48</li></ul><p>Garen</p><p><i>Base Stats</i></p><ul><li>Attack Speed Ratio: 0.625</li><li>Base Attack Speed: 0.625</li><li>Base Bonus Attack Speed: 0.28</li><li>Attack Speed per Level: 0.024</li></ul><p>Aatrox</p><p><i>Base Stats</i></p><ul><li>Attack Speed Ratio: 0.651</li><li>Base Attack Speed: 0.651</li><li>Base Bonus Attack Speed: 0.13</li><li>Attack Speed per Level: 0.021</li></ul><p>Lux</p><p><i>Base Stats</i></p><ul><li>Attack Speed Ratio: 0.625</li><li>Base Attack Speed: 0.625</li><li>Base Bonus Attack Speed: 0.2</li><li>Attack Speed per Level: 0.03</li></ul><p>Amumu</p><p><i>Base Stats</i></p><ul><li>Attack Speed Ratio: 0.638</li><li>Base Attack Speed: 0.638</li><li>Base Bonus Attack Speed: 0.25</li><li>Attack Speed per Level: 0.024</li></ul><p>Kayn</p><p><i>Base Stats</i></p><ul><li>Attack Speed Ratio: 0.67</li><li>Base Attack Speed: 0.67</li><li>Base Bonus Attack Speed: 0.2</li><li>Attack Speed per Level: 0.018</li></ul><p>Rengar</p><p><i>Base Stats</i></p><ul><li>Attack Speed Ratio: 0.667</li><li>Base Attack Speed: 0.667</li><li>Base Bonus Attack Speed: 0.2</li><li>Attack Speed per Level: 0.023</li></ul><p>Karma</p><p><i>Base Stats</i></p><ul><li>Attack Speed Ratio: 0.625</li><li>Base Attack Speed: 0.625</li><li>Base Bonus Attack Speed: 0.2</li><li>Attack Speed per Level: 0.0135</li></ul><p>Nunu &amp; Willump</p><p><i>Base Stats</i></p><ul><li>Attack Speed Ratio: 0.625</li><li>Base Attack Speed: 0.625</li><li>Base Bonus Attack Speed: 0.28</li><li>Attack Speed per Level: 0.0122</li></ul><p>Wukong</p><p><i>Base Stats</i></p><ul><li>Attack Speed Ratio: 0.625</li><li>Base Attack Speed: 0.625</li><li>Base Bonus Attack Speed: 0.28</li><li>Attack Speed per Level: 0.028</li></ul><p>Vayne</p><p><i>Bas
