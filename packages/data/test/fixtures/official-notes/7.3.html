<!doctype html><html><head></head><body><script id="__NEXT_DATA__" type="application/json">{"props": {"pageProps": {"page": {"blades": [{"type": "riotbar"}, {"type": "articleMasthead", "title": "Wild Rift Patch Notes 7.3", "publishDate": "2026-09-21T09:00:00.000Z"}, {"type": "articleRichText", "richText": {"body": "<p><meta></p><p>Banana? 🍌🥽</p><p>Patch 7.3 is here, and the minions are ready to make some noise. We’re updating turrets and minion waves, overhauling the marksman ecosystem with new items and crit changes, shaking up the jungle, bringing a fresh set of updates to Ranked and Legendary Ranked, and so much more.</p><p>Grab your goggles and get ready to cause a little mayhem on the Rift!</p><p>&nbsp;</p><p><i>Reminder: content will be released throughout the patch.</i></p>"}}, {"type": "separator"}, {"type": "articleRichText", "richText": {"body": "<h2>NEW</h2><h3>NEW CHAMPIONS</h3><h4>Hwei</h4><p>Hwei is a brooding painter who creates brilliant art in order to confront Ionia's criminals and comfort their victims. Beneath his melancholy roils a torn, emotional mind—haunted by both the vibrant visions of his imagination and the gruesome memories of his temple's massacre. Hwei seeks to understand this light and dark, which drives him inevitably toward the artist who unraveled him. With paintbrush and palette, Hwei shapes endless possibilities as he draws ever closer to earning closure or embracing despair.</p><p><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/92387e4bbb55efb21aa995065f509b93936ff741-1920x1080.jpg\" width=\"1920\" height=\"1080\"></p><p style=\"text-align:center;\"><meta>Hwei</p><p><meta></p><h3>New Season</h3><p>Ranked Season S23 is almost here, bringing a new season-exclusive skin, Glorious Eminence Milio, alongside some major updates to Ranked and Legendary Ranked.</p><p><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/3c3af1b7a4e7b405b9e6ee9a367ce3131d4dbb8c-1920x1080.jpg\" width=\"1920\" height=\"1080\"></p><p style=\"text-align:center;\"><meta>Glorious Eminence Milio</p><p><meta></p><p>This season, we’re updating several systems to better recognize your individual performance, improve matchmaking, and support a healthier role ecosystem. These changes include updates to S/A ratings and MVP selection, the new Legendary Trial in Legendary Ranked, a rework of the Champion Score system, and a new Priority Role Bonus.</p><p>We’re also standardizing the Pick/Ban experience across higher ranks. Platinum through Diamond will now have five bans per team, up from three, and we’re removing the restriction that previously disabled five bans during the first two weeks of a new season. This should give teams more room to make strategic choices from the very start of the climb.</p><p>Ranked Season S23 begins on September 23, 2026 at 03:00 UTC and is expected to end in January 2027. Check the Ranked queue interface in-game for the exact season schedule.</p><h3>New Wild Pass</h3><p>The Wild Pass is getting an upgrade, with more rewards, more choice, and a fresh new look! The Pencil Sharpener Wild Pass arrives on September 22 at 00:00 UTC, featuring Pencil Sharpener Kog'Maw and Ascended Pencil Sharpener Kog'Maw.</p><p><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/c4fcb23f5dd70436f82f9f6f0706b829d2e68dd4-1920x1080.jpg\" width=\"1920\" height=\"1080\"></p><p style=\"text-align:center;\"><meta>Pencil Sharpener Kog'Maw</p><p><meta></p><h4>CONTENT UPDATES</h4><ul><li>New personalization rewards are joining the Wild Pass, including the Super Pencil Sharpener Battle Ensign and the Ear to Ear emote.</li><li>You’ll now have more choice when it comes to your Wild Pass skin rewards. Select the current Wild Pass skin or choose from a selection of returning Wild Pass skins.</li><li>Returning Wild Pass skins: Dream Raider Thresh, Unleashed Dream Raider Thresh, Food Spirits Amumu, and Ascended Food Spirits Amumu.</li><li>Returning Mini Pass skins: Dragonslayer Kayle, Dragonslayer Kayle (Amber), Blackfrost Renekton, and Blackfrost Renekton (Purple).</li><li>Battlecast Urgot is also returning with its own Mini Pass skin track! This track shares level progress with the current Wild Pass, so leveling up will unlock rewards from both tracks at the same time.</li></ul><h4>Wild Star Reward Optimization</h4><ul><li>We’re making Wild Stars easier to earn. All Wild Stars will now be available within the first seventy-five Wild Pass levels, so you’ll no longer need to grind recurring rewards to collect them all.</li><li>We’re also increasing the total number of Wild Stars you can earn. Reaching Wild Pass level seventy-five will now grant a total of three hundred thirty Wild Stars, up from two hundred fifty. Reaching Mini Pass level fifty will grant one hundred forty Wild Stars, up from one hundred.</li><li>Purchasing the Wild Pass Elite will now immediately grant an additional two hundred Wild Stars.</li><li>Stellacorn’s Gift will now add two Wild Stars to your daily reward, while Celestial Blessing will add three Wild Stars.</li><li>Expired Wild Stars will now automatically convert into five Condensed Ore instead of one Blue Mote.</li></ul><h4>Collection System and Wild Pass Emporium Revamp</h4><ul><li>The Wild Pass Emporium will be removed with this update.</li><li>Personalization rewards can now be redeemed directly through the Set Redemption window.</li><li>Battle Ensigns will now be available through Wild Star redemption for four hundred fifty-five Wild Stars, instead of being acquired through loot.</li><li>Battle Ensigns will also be removed from the Trove.</li></ul><h4>New Wild Star Spending Milestones</h4><ul><li>Spending Wild Stars will now unlock personalization rewards at certain milestones. Personalization items that were previously available outside of sets in the Wild Pass Emporium will now be earned based on your total Wild Stars spent.</li></ul><h4>Full UI Refresh</h4><ul><li>The Wild Pass is getting a fresh new look! We’ve updated the interface to make it easier to navigate, give you a clearer view of your rewards, and added a few quality-of-life improvements along the way.</li></ul><h4>Reward Level Adjustments</h4><ul><li>We’ve swapped the positions of the Wild Pass skin and Random Skin Chest. The Wild Pass skin will now unlock immediately at level one when you purchase the Advanced Pass or higher, while the Random Skin Chest will move to level twenty.</li></ul><h4>Reindeer Mini Pass</h4><ul><li>Once the Pencil Sharpener Wild Pass wraps up, the Reindeer Mini Pass arrives on December 3, featuring the all-new Reindeer Smolder and Reindeer Smolder (Pink).</li><li>The Mini Pass will have its own level progression, exclusive rewards, and missions, tailored specifically to the shorter Mini Pass period.</li><li>Wild Stars can be used across both the Wild Pass and Mini Pass while they’re active. Any unused Wild Stars will be automatically reclaimed after the Mini Pass ends, so be sure to spend them before time runs out.</li></ul><h2>CHAMPION ADJUSTMENTS</h2><p>Marksmen are at their best when different champions have distinct ways to carry. Some should hit hard with powerful critical strikes, while others rely on Attack Speed, sustained damage, and precise positioning to take over a fight.</p><p>Recently, those differences have become less noticeable. Crit and on-hit marksmen have both become increasingly reliant on Attack Speed, while item choices and build paths have started to feel too similar across the roster.</p><p>In Patch 7.3, we’re making a broad update to the marksman ecosystem to give these playstyles more room to shine. We’re increasing Critical Strike Damage, reworking Lethal Tempo, adjusting Attack Speed and vamp, refining champion damage profiles, and updating marksman items.</p><p>Our goal is to create clearer strengths, build paths, and power curves across the marksman roster, so how you choose to carry depends more on the champion you’re playing, and how you play them.</p><h3>Marksman Systematic Adjustments</h3><p>We’re increasing base Critical Strike Damage to give crit-focused marksmen more power behind each basic attack and help further distinguish them from Attack Speed-focused carries. To account for this increase, we’re also adjusting abilities that scale with Critical Strike Chance or Critical Strike Damage.</p><ul><li>Base Critical Strike Damage<strong>:</strong> 175% → 200%</li></ul><p>Critical Rate</p><ul><li>Crit Damage: 175% → 200%</li></ul><h4>Attack Speed</h4><p>We’re adjusting marksmen’s Attack Speed growth and ratios to create clearer differences in how each champion scales and which items they prefer. Some champions will get more value from building Attack Speed, while others will naturally lean toward heavier Attack Damage options.</p><p>For example, Caitlyn will now have higher base Attack Speed and Attack Speed growth, but a lower Attack Speed ratio. This gives her plenty of Attack Speed naturally while encouraging her to prioritize harder-hitting Attack Damage items.</p><ul><li>Attack Speed cap (attacks per second): 2.5 → 3</li><li>Attack Speed per Level adjustments for certain champions</li><li>Attack Speed ratios are no longer divided by melee and ranged; each champion will now have an individual Attack Speed ratio.</li><li>For a detailed breakdown of these changes, check out the appendix below: [Champion Attack Speed Details and Mechanics Overview].&nbsp;</li></ul><h3>Marksman Champion Adjustments</h3><p>Basic attacks aren’t the only way marksmen deal damage, so we’re also updating several champions’ abilities to better support their intended builds and playstyles.</p><p>Several core damage abilities will now scale with Critical Strike Chance and Critical Strike Damage, allowing crit builds to strengthen both basic attacks and abilities while giving Infinity Edge a clearer role as a capstone item.</p><p>We’re also updating some ability mechanics that no longer fully support their champion’s intended identity, including Lucian and Twitch, to give their kits and playstyles a clearer definition.</p>"}}, {"type": "characterChanges", "title": null, "characters": [{"character": {"name": "EZREAL"}, "changes": [{"title": "Base Stats", "description": {"body": "<ul><li>Base Attack Damage: 58 → 60</li></ul>"}}, {"title": "Mystic Shot", "description": {"body": "<p><meta></p><ul><li>Cooldown: 4.5/4/3.5/3s → 5.5/5/4.5/4s</li><li>Damage: 50 / 85 / 120 / 155 + 135% Attack Damage + 30% Ability Power → 25 / 55 / 85 / 115 + 135% Attack Damage + 30% Ability Power</li><li>Cooldown refund: reduces the cooldown of all other abilities except [Mystic Shot] → reduces the cooldown of all abilities</li></ul>"}}, {"title": "Trueshot Barrage", "description": {"body": "<p><meta></p><ul><li>Cooldown: 70 / 65 / 60s → 80 / 70 / 60s</li><li>Damage: 350 / 500 / 650 + 100% bonus Attack Damage + 90% Ability Power → 300 / 500 / 700 + 100% bonus Attack Damage + 100% Ability Power</li></ul>"}}]}, {"character": {"name": "KAI'SA"}, "changes": [{"title": "Base Stats", "description": {"body": "<p><meta></p><ul><li>Base Attack Damage: 62 → 59</li></ul>"}}, {"title": "Second Skin", "description": {"body": "<p><meta></p><ul><li>Plasma damage: 4.5 + 0.5 × level + 15% Ability Power → 4 + 1 × level + 12% Ability Power + current Plasma stacks × (1 + 0.2 × level + 2% Ability Power)</li><li>Missing Health damage: (15 + 2.5% Ability Power)% → (15 + 5% Ability Power)%</li></ul>"}}, {"title": "Void Seeker", "description": {"body": "<p><meta></p><ul><li>Damage: 30 / 60 / 90 / 120 + 110% Attack Damage + 60% Ability Power → 30 / 60 / 90 / 120 + 130% Attack Damage + 50% Ability Power</li></ul>"}}, {"title": "Supercharge", "description": {"body": "<p><meta></p><ul><li>Movement Speed: 50% / 55% / 60% / 65% + 80% × item Attack Speed × 50% / 55% / 60% / 65% (item Attack Speed capped at 90% / 99% / 108% / 117%) → 50% / 55% / 60% / 65% + bonus Attack Speed * 50% / 55% / 60% / 65% (maximum 100% / 110% / 120% / 130%)</li></ul>"}}, {"title": "Killer Instinct", "description": {"body": "<p><meta></p><ul><li>Shield: 75 / 100 / 125 + 100 / 150 / 200% Attack Damage + 75% Ability Power → 100 / 125 / 150 + 80 / 120 / 160% Attack Damage + 100% Ability Power</li></ul>"}}]}, {"character": {"name": "TWITCH"}, "changes": [{"title": "Base Stats", "description": {"body": "<p><meta></p><ul><li>Base Attack Damage: 54 → 58</li><li>Attack Damage per Level: 4.5 → 4</li></ul>"}}, {"title": "Deadly Venom", "description": {"body": "<p><meta></p><ul><li>Damage per stack: 1 / 2 / 3 / 4 / 5 + 2.5% Ability Power → 1 / 2 / 3 / 4 / 5 + 3% Ability Power</li><li>[Removed] When enemy champions reach max poison stacks, Twitch gains 30 / 35 / 40 / 45 / 50% Attack Speed (at levels 1 / 4 / 7 / 10 / 13) for 5 seconds. Reapplying refreshes the duration.</li></ul>"}}, {"title": "Ambush", "description": {"body": "<p><meta></p><ul><li>[New] After leaving camouflage, Twitch gains 35 / 40 / 45 / 50% bonus Attack Speed for 6 seconds.</li><li>[Removed] For 3 seconds after leaving camouflage, Twitch's basic attacks apply 2 stacks of Deadly Venom.</li></ul>"}}, {"title": "Venom Cask", "description": {"body": "<p><meta></p><ul><li>Twitch throws a Venom Cask into the target area, granting vision there and slowing enemies inside by 30% / 35% / 40% / 45% + 0.06% × Ability Power. The area lasts 3 seconds and applies 1 stack of Deadly Venom each second to enemies inside.</li></ul>"}}, {"title": "Contaminate", "description": {"body": "<p><meta></p><ul><li>Direct detonation physical damage: 25 / 35 / 45 / 55 → 30 / 40 / 50 / 60</li><li>Physical damage per stack: 20 / 25 / 30 / 35 + 42% bonus Attack Damage + 18% Ability Power → 20 / 25 / 30 / 35 + 35% bonus Attack Damage</li><li>[New] Magic damage per stack: 35% Ability Power</li><li>[New] This ability can only be cast while a poisoned target is within 1200 units of Twitch.</li></ul>"}}, {"title": "Spray and Pray", "description": {"body": "<p><meta></p><ul><li>Cooldown: 70 / 65 / 60s → 75 / 70 / 65s</li><li>Projectile speed: 60 → 65</li></ul>"}}]}, {"character": {"name": "LUCIAN"}, "changes": [{"title": "Base Stats", "description": {"body": "<p><meta></p><ul><li>Base Attack Damage: 58 → 60</li><li>Attack Damage per Level: 4 → 3.5</li></ul>"}}, {"title": "Lightslinger", "description": {"body": "<p><meta></p><ul><li>Secondary shot damage: 35% / 50% / 65% Attack Damage → 40% / 50% / 60% Attack Damage</li></ul>"}}, {"title": "Piercing Light", "description": {"body": "<p><meta></p><ul><li>Damage: 80 / 125 / 170 / 215 + 65 / 85 / 105 / 125% × bonus Attack Damage → 75 / 125 / 175 / 225 + 100% × bonus Attack Damage</li></ul>"}}, {"title": "The Culling", "description": {"body": "<p><meta></p><ul><li>Bullet count: 22 / 26 / 30 → 20 + 20 × Critical Rate (gain 2 bullets for every 10% Critical Rate) + (Critical Damage-2) × 20 × Critical Rate&nbsp;</li><li>Damage per bullet: 20 / 35 / 50 + 25% Attack Damage + 10% Ability Power → 20 / 25 / 30 + 25% Attack Damage + 15% Ability Power</li></ul>"}}]}, {"character": {"name": "CAITLYN"}, "changes": [{"title": "Base Stats", "description": {"body": "<p><meta></p><ul><li>Attack Speed Ratio: 0.625</li><li>Base Attack Speed: 0.625</li><li>Base Bonus Attack Speed: 0.28</li><li>Attack Speed per Level: 0.04</li><li>Base Attack Damage: 54 → 60</li><li>Attack Damage per Level: 4.5 → 4.2</li></ul>"}}, {"title": "Headshot", "description": {"body": "<p><meta></p><ul><li>Headshot bonus damage: (60% - 110%) × Attack Damage + 200 × Critical Rate → (60% - 100%) × Attack Damage + Critical Rate × 100% + (Critical Damage-2) × Critical Rate × 100% × Attack Damage</li></ul>"}}, {"title": "Piltover Peacemaker", "description": {"body": "<p><meta></p><ul><li>Damage: 60 / 110 / 160 / 210 + 125 / 140 / 155 / 170% Attack Damage → 50 / 100 / 150 / 200 + 125 / 145 / 165 / 185% Attack Damage</li></ul>"}}, {"title": "Yordle Snap Trap", "description": {"body": "<p><meta></p><ul><li>[New] Headshot attacks against enemies trapped by Yordle Snap Trap deal 40 / 90 / 140 / 190 (+30% bonus Attack Damage) bonus physical damage.</li></ul>"}}, {"title": "90 Caliber Net", "description": {"body": "<p><meta></p><ul><li>Slow duration: 1.5s → 1s</li></ul>"}}, {"title": "Ace in the Hole", "description": {"body": "<p><meta></p><ul><li>Damage: 200 / 375 / 550 + 200% bonus Attack Damage + 20% target missing Health → (250 / 450 / 650 + 100% bonus Attack Damage + 20% target missing Health) × (1 + Critical Rate × 30% + (Critical Damage - 2) × 30% × Critical Rate)</li></ul>"}}]}, {"character": {"name": "DRAVEN"}, "changes": [{"title": "Base Stats", "description": {"body": "<p><meta></p><ul><li>Attack Damage per Level: 4.5 → 3.8</li></ul>"}}, {"title": "League of Draven", "description": {"body": "<p><meta></p><ul><li>Bounty: 80 + (stacks) × 4 → 60 + (stacks) × 3</li></ul>"}}, {"title": "Spinning Axe", "description": {"body": "<p><meta></p><ul><li>Damage: 45 / 50 / 55 / 60 + 100 / 110 / 120 / 130% → 45 / 50 / 55 / 60 + 80 / 90 / 100 / 110%</li></ul>"}}, {"title": "Whirling Death", "description": {"body": "<p><meta></p><ul><li>Damage falloff per hit: 8% (minimum 40%) → 5% (minimum 50%)</li><li>[New] Enemy champions hit whose current Health is lower than Draven's current Adoration stacks are executed.</li></ul>"}}]}, {"character": {"name": "MISS FORTUNE"}, "changes": [{"title": "Love Tap", "description": {"body": "<p><meta></p><ul><li>Damage: (15 + 40% bonus Attack Damage) × (1 + Critical Rate) → (15 + 40% bonus Attack Damage) × (0.6 + Critical Rate × 0.4)</li><li>Damage Amp: 6% - 10.9% (based on level) → 6% - 9.5% (based on level)</li></ul>"}}, {"title": "Double Up", "description": {"body": "<p><meta></p><ul><li>Damage: 60 / 90 / 120 / 150 + 112 / 120 / 128 / 136% Attack Damage + 35% Ability Power → 60 / 90 / 120 / 150 + 110% Attack Damage + 35% Ability Power</li><li>Second-hit damage ratio: 120% → 60% × current Critical Damage</li><li>Optimized the bounce target-selection rules.</li></ul>"}}, {"title": "Strut", "description": {"body": "<p><meta></p><ul><li>Initial Movement Speed: 30 / 35 / 40 / 45 → 35 / 40 / 45 / 50</li><li>Maximum Movement Speed: 80 / 90 / 100 / 110 → 70 / 80 / 90 / 100</li></ul>"}}, {"title": "Make It Rain", "description": {"body": "<p><meta></p><ul><li>Slow: 30 / 40 / 50 / 60% → 40% + 0.06% × Ability Power</li></ul>"}}, {"title": "Bullet Time", "description": {"body": "<p><meta></p><ul><li>Barrage damage: 85% Attack Damage + 20% Ability Power → 20 / 30 / 40 + 60% Attack Damage + 20% Ability Power</li><li>Critical ratio: 130% → 130% + (Critical Damage-2) × 0.3</li></ul>"}}]}, {"character": {"name": "SAMIRA"}, "changes": [{"title": "Base Stats", "description": {"body": "<p><meta></p><ul><li>Base Attack Damage: 62 → 60</li><li>Attack Speed Ratio: 0.658</li><li>Base Attack Speed: 0.658</li><li>Base Bonus Attack Speed: 0.14</li><li>Attack Speed per Level: 0.03</li><li>Attack Damage per Level: 4 → 3.5</li></ul>"}}, {"title": "Daredevil Impulse", "description": {"body": "<p><meta></p><ul><li>Movement Speed bonus per Style grade: 4% → 3% / 3.25% / 3.5% / 3.75% / 4% (based on level)</li></ul>"}}, {"title": "Flair", "description": {"body": "<p><meta></p><ul><li>Damage: 15 / 20 / 25 / 30 + 100 / 115 / 130 / 145% Attack Damage → 15 / 20 / 25 / 30 + 110% Attack Damage</li><li>Critical Damage: current Critical Damage - 50% → 150% - 165% (based on Critical Damage)</li><li>New: Flair’s Damage can not trigger Life Steal.</li></ul>"}}, {"title": "Blade Whirl", "description": {"body": "<p><meta></p><ul><li>Bonus Attack Damage ratio: 80% → 50%</li></ul>"}}, {"title": "Wild Rush", "description": {"body": "<p><meta></p><ul><li>Attack Speed: 35% / 40% / 45% / 50% → 25% / 30% / 35% / 40%</li></ul>"}}, {"title": "Inferno Trigger", "description": {"body": "<p><meta></p><ul><li>Cooldown: 8 / 8 / 8 → 6 / 6 / 6</li><li>Mana cost: 60 / 30 / 0 → 0 / 0 / 0</li><li>Damage: 5 / 20 / 35 + 60% Attack Damage → 20 / 40 / 60 + 40% Attack Damage</li><li>New: Inferno Trigger’s Damage can now trigger 66.7% Life Steal.</li></ul>"}}]}, {"character": {"name": "ZERI"}, "changes": [{"title": "Living Battery", "description": {"body": "<p><meta></p><ul><li>Excess Attack Speed to Attack Damage conversion ratio: 50% → 60%</li><li>Damage: 13 / 15 / 17 / 19 / 21 + 105 / 110 / 115 / 120 / 125% Attack Damage → 20 / 24 / 28 / 32 / 36 + 102 / 104 / 106 / 108% / 110% Attack Damage</li></ul>"}}, {"title": "Burst Fire", "description": {"body": "<p><meta></p><ul><li>Damage: 35 / 60 / 85 / 110 + 55 / 70 / 85 / 100% Attack Damage + 30 / 35 / 40 / 45% Ability Power → 70 / 100 / 130 / 160 + 80% × bonus Attack Damage + 30 / 35 / 40 / 45% Ability Power</li><li>Slow duration: 2s → 1.5s</li></ul>"}}, {"title": "Ultrashock Laser", "description": {"body": "<p><meta></p><ul><li>Damage: 30 / 70 / 110 / 150 + 80% Attack Damage + 40% Ability Power → 60 / 100 / 140 / 180 + 100% Attack Damage + 50% Ability Power</li><li>Critical Damage: current Critical Damage rate → (150% + (Critical Damage rate - 2) × 0.5)</li></ul>"}}, {"title": "Spark Surge", "description": {"body": "<p><meta></p><ul><li>Subsequent damage ratio: 80 / 85 / 90 / 95% → 85 / 90 / 95 / 100%</li></ul>"}}, {"title": "Lightning Crash", "description": {"body": "<p><meta></p><ul><li>Nova damage: 150 / 200 / 250 + 70% bonus Attack Damage + 80% Ability Power → 150 / 225 / 300 + 60% bonus Attack Damage + 100% Ability Power</li><li>Overload duration: 1.5s&nbsp; → 2.5s&nbsp;</li><li>Overload extension duration: 1.5s on non-critical strikes, 4.5s on critical strikes → 2.5s on non-critical strikes, 7.5s on critical strikes</li><li>Overload lightning Attack Damage ratio: 25% → 30%</li><li>Critical Damage: current Critical Damage → 150% + (Critical Damage - 2) × 0.5</li></ul>"}}]}, {"character": {"name": "JINX"}, "changes": [{"title": "Base Stats", "description": {"body": "<p><meta></p><ul><li>Attack Damage per Level: 4.5 → 4</li></ul>"}}, {"title": "Super Mega Death Rocket!", "description": {"body": "<p><meta></p><ul><li>Cooldown: 50 / 45 / 40s → 60 / 50 / 40s</li><li>Damage: 25 / 35 / 45 + 15% × bonus Attack Damage to 250 / 350 / 450 + 150% × bonus Attack Damage → 25 / 35 / 45 + 12% × bonus Attack Damage to 250 / 350 / 450 + 120% × bonus Attack Damage</li></ul>"}}]}, {"character": {"name": "AKSHAN"}, "changes": [{"title": "Base Stats", "description": {"body": "<p><meta></p><ul><li>Attack Damage per Level: 5.5 → 4.5</li></ul>"}}, {"title": "Dirty Fighting", "description": {"body": "<p><meta></p><ul><li>Movement Speed: 40 - 120 (based on level) → 20 - 80 (based on level) × (1 + 100% bonus Attack Speed)</li></ul>"}}, {"title": "Avengerang", "description": {"body": "<p><meta></p><ul><li>Damage: 10 / 40 / 70 / 100 + 85% Attack Damage → 60 / 110 / 160 / 210 + 70% × bonus Attack Damage</li><li>Minion damage ratio: 55 / 70 / 85 / 100% → 50 / 60 / 70 / 80%</li></ul>"}}, {"title": "Heroic Swing", "description": {"body": "<p><meta></p><ul><li>Critical Damage: 150% → current Critical Damage × 0.7</li></ul>"}}, {"title": "Comeuppance", "description": {"body": "<p><meta></p><ul><li>Damage per bullet: (20 / 30 / 40 + 10% Attack Damage) - (80 / 120 / 160 + 40% Attack Damage) → (25 / 35 / 45 + 15% Attack Damage) - (75 / 105 / 135 + 45% Attack Damage)</li><li>Damage increase from critical-strike stats: 50% * Critical Rate → 30% × Critical Rate + (Critical Damage - 2) × Critical Rate × 0.3</li></ul>"}}]}, {"character": {"name": "CORKI"}, "changes": [{"title": "Base Stats", "description": {"body": "<p><meta></p><ul><li>Attack Damage per Level: 3 → 2.5</li></ul>"}}, {"title": "Phosphorus Bomb", "description": {"body": "<p><meta></p><ul><li>Damage: 65 / 125 / 185 / 245 + 125% bonus Attack Damage + 80% Ability Power → 60 / 120 / 185 / 240 + 110% bonus Attack Damage + 100% Ability Power</li></ul>"}}, {"title": "Gatling Gun", "description": {"body": "<p><meta></p><ul><li>Armor and Magic Resistance reduction: 10 / 14 / 18 / 22 → 12 / 14 / 16 / 18</li></ul>"}}, {"title": "Missile Barrage", "description": {"body": "<p><meta></p><ul><li>Missile bonus Attack Damage ratio: 70% bonus Attack Damage → 65% bonus Attack Damage</li><li>Big One bonus Attack Damage ratio: 140% bonus Attack Damage → 130% bonus Attack Damage</li></ul>"}}]}, {"character": {"name": "KALISTA"}, "changes": [{"title": "Base Stats", "description": {"body": "<p><meta></p><ul><li>Base Attack Damage: 54 → 57</li><li>Attack Damage per Level: 5 → 5.2</li></ul>"}}]}, {"character": {"name": "KOG'MAW"}, "changes": [{"title": "Base Stats", "description": {"body": "<p><meta></p><ul><li>Base Attack Damage: 54 → 58</li><li>Attack Speed Ratio: 0.665</li><li>Base Attack Speed: 0.665</li><li>Base Bonus Attack Speed: 0.2</li><li>Attack Speed per Level: 0.03</li></ul>"}}]}, {"character": {"name": "VARUS"}, "changes": [{"title": "Base Stats", "description": {"body": "<p><meta></p><ul><li>Base Attack Damage: 54 → 58</li></ul>"}}]}, {"character": {"name": "XAYAH"}, "changes": [{"title": "Base Stats", "description": {"body": "<p><meta></p><ul><li>Attack Speed Ratio: 0.658</li><li>Base Attack Speed: 0.658</li><li>Base Bonus Attack Speed: 0.22</li><li>Attack Speed per Level: 0.03</li><li>Base Attack Damage: 54 → 60</li><li>Attack Damage per Level: 5 → 4.2</li></ul>"}}, {"title": "Deadly Plumage", "description": {"body": "<p><meta></p><ul><li>Attack Speed: 45 / 50 / 55 / 60% → 40 / 45 / 50 / 55%</li><li>Additional feather damage ratio: 20% → 25%</li><li>Movement Speed: 25 / 30 / 35 / 40% → 30%</li></ul>"}}, {"title": "Bladecaller", "description": {"body": "<p><meta></p><ul><li>Damage: 60 / 70 / 80 / 90 + 90% bonus Attack Damage → (70 / 80 / 90 / 100 + 50% bonus Attack Damage) × (1 + 50% × Critical Rate + 50% × (Critical Damage-2) × Critical Rate)</li></ul>"}}, {"title": "Featherstorm", "description": {"body": "<p><meta></p><ul><li>Damage: 125 / 250 / 375 + 100% bonus Attack Damage → 150 / 250 / 350 + 100% bonus Attack Damage</li></ul>"}}]}, {"character": {"name": "TRISTANA"}, "changes": [{"title": "Base Stats", "description": {"body": "<p><meta></p><ul><li>Base Attack Damage: 54 → 60</li><li>Attack Damage per Level: 6 → 5</li></ul>"}}, {"title": "Rocket Jump", "description": {"body": "<p><meta></p><ul><li>Cooldown: 22 / 19 / 16 / 13 → 22 / 20 / 18 / 16</li><li>Damage: 85 / 155 / 225 / 295 + 50% Ability Power → 80 / 120 / 160 / 200 + 80% × bonus Attack Damage + 50% Ability Power</li><li>Slow effect: 60% → 50%</li><li>Slow duration: 1.5 / 2 / 2.5 / 3s → 2s</li></ul>"}}, {"title": "Explosive Charge", "description": {"body": "<p><meta></p><ul><li>Cooldown: 15 / 14 / 13 / 12 → 16 / 15 / 14 / 13</li><li>Passive explosion damage: 65 / 100 / 135 / 170 + 25% Ability Power → 60 / 90 / 120 / 150 + 25% Ability Power</li><li>Active explosion damage: 50 / 75 / 100 / 125 + 75 / 110 / 145 / 180% bonus Attack Damage + 50% Ability Power → (80 / 100 / 120 / 140 + 100% bonus Attack Damage + 50% Ability Power) × (1 + Critical Rate × 40% + (Critical Damage-2) × 40% × Critical Rate)</li><li>Damage per stack: 30% → 25%</li></ul>"}}, {"title": "Buster Shot", "description": {"body": "<p><meta></p><ul><li>Damage: 350 / 450 / 550 + 100% Ability Power → 300 / 350 / 400 + 70%× bonus Attack Damage + 100% Ability Power</li></ul>"}}]}, {"character": {"name": "SIVIR"}, "changes": [{"title": "Base Stats", "description": {"body": "<p><meta></p><ul><li>Base Attack Damage: 58 → 60</li><li>Attack Speed Ratio: 0.625</li><li>Base Attack Speed: 0.625</li><li>Base Bonus Attack Speed: 0.3</li><li>Attack Speed per Level: 0.01</li></ul>"}}, {"title": "Fleet of Foot", "description": {"body": "<p><meta></p><ul><li>Movement Speed bonus: 31 - 45 (based on level) → 55 - 70 (based on level)</li></ul>"}}, {"title": "Boomerang Blade", "description": {"body": "<p><meta></p><ul><li>Damage: 10 / 30 / 50 / 70 + 75 / 80 / 85 / 90% Attack Damage + 60% Ability Power × 50% × Critical Rate → (70 / 100 / 130 / 160 + 70% × bonus Attack Damage + 60% Ability Power) × (1 + Critical Rate × 40% + (Critical Damage-2) × 40% × Critical Rate)</li><li>Non-champion damage ratio: 80% → 75%</li></ul>"}}, {"title": "Ricochet", "description": {"body": "<p><meta></p><ul><li>Damage: 4 / 6 / 8 / 10 + 15 / 18 / 21 / 24% Attack Damage → 37.5% / 40% / 42.5% / 45% Attack Damage</li><li>Minion ratio: 75% → 70%</li></ul>"}}, {"title": "On the Hunt", "description": {"body": "<p><meta></p><ul><li>Initial Movement Speed bonus: 15% → 15 / 20 / 25%</li><li>Initial Movement Speed duration: 10 / 11 / 12 seconds → 8 / 10 / 12 seconds</li><li>Cooldown reduction ratio: 30 / 35 / 40% → 20 / 25 / 30%</li><li>Attack Damage per morale stack: 2 / 3 / 4 → 2 / 2.5 / 3</li><li>Re-triggering refreshes Hunt duration.</li><li>Movement Speed granted on re-trigger: 25% → 15 / 20 / 25%</li></ul>"}}]}, {"character": {"name": "VAYNE"}, "changes": [{"title": "Base Stats", "description": {"body": "<p><meta></p><ul><li>Base Attack Damage: 54 → 60</li></ul>"}}, {"title": "Tumble", "description": {"body": "<p><meta></p><ul><li>Damage: 35 / 45 / 55 / 65% Attack Damage → 50 / 60 / 70 / 80% Attack Damage</li></ul>"}}, {"title": "Silver Bolts", "description": {"body": "<p><meta></p><ul><li>True Damage based on Maximum Health: 2 / 5 / 8 / 11% → 6 / 7 / 8 / 9%</li></ul>"}}, {"title": "Final Hour", "description": {"body": "<p><meta></p><ul><li>Attack Damage: 15 / 25 / 35 → 30 / 40 / 50</li></ul>"}}]}, {"character": {"name": "ASHE"}, "changes": [{"title": "Base Stats", "description": {"body": "<p><meta></p><ul><li>Attack Damage per Level: 2.65 → 4</li><li>Base Attack Damage: 58 → 60</li></ul>"}}, {"title": "Frost Shot", "description": {"body": "<p><meta></p><ul><li>Slow effect: 15 / 17.5 / 20 / 22.5 / 25% (based on level) → 20 / 22.5 / 25 / 27.5 / 30% (based on level)</li><li>Bonus damage: 10% + 100% × Critical Rate × (Critical Damage-1) → 100% × Critical Rate + 100% × (Critical Damage-2) × Critical Rate</li></ul>"}}, {"title": "Ranger's Focus", "description": {"body": "<p><meta></p><ul><li>Mana cost: 50 / 50 / 50 / 50 → 30 / 30 / 30 / 30</li></ul>"}}, {"title": "Volley", "description": {"body": "<p><meta></p><ul><li>Cooldown: 16 / 13.5 / 11 / 8.5s → 15 / 12 / 9 / 6s</li><li>Mana cost: 50 / 50 / 50 / 50 → 65 / 60 / 55 / 50</li><li>Damage: 20 / 35 / 50 / 65 + 115% Attack Damage → 70 / 110 / 150 / 190 + 100% bonus Attack Damage</li></ul>"}}]}, {"character": {"name": "JHIN"}, "changes": [{"title": "Base Stats", "description": {"body": "<p><meta></p><ul><li>Base Attack Damage: 58 → 60</li><li>Attack Damage Growth: 4.55 → 5</li></ul>"}}, {"title": "Whisper", "description": {"body": "<p><meta></p><ul><li>[New] Critical strikes now deal only 80% of normal critical strike damage.</li><li>Fourth-shot bonus damage to turrets: 135% / 162% (with Infinity Edge) → 150% / 172.5% (with Infinity Edge)</li><li>Attack Damage conversion ratio: bonus Attack Speed × 30% + Critical Rate × 45% + level × 4.5% → bonus Attack Speed × 30% + Critical Rate × 40% + level × 3%</li><li>Critical-strike Movement Speed: 15% + 0.55% × bonus Attack Speed → 14% + 0.44% × bonus Attack Speed</li></ul>"}}, {"title": "Curtain Call", "description": {"body": "<p><meta></p><ul><li>Fourth super shot damage ratio: 200% → current Critical Damage</li></ul>"}}]}, {"character": {"name": "SENNA"}, "changes": [{"title": "Absolution", "description": {"body": "<p><meta></p><ul><li>Attack Speed Ratio: 0.4</li><li>Base Attack Speed: 0.4</li><li>Base Bonus Attack Speed: 0.6</li><li>Attack Speed per Level: 0.05</li><li>Damage based on Current Health: 1.2%~12% (based on level) → 1%~10% (based on level)</li><li>Critical Rate gained per 20 Mist: 15% → 10%</li><li>[New] Basic attacks now deal 90% of normal critical strike damage when they critical strike.</li></ul>"}}, {"title": "Piercing Darkness", "description": {"body": "<p><meta></p><ul><li>Base Damage: 50 / 90 / 130 / 170 → 50 / 80 / 110 / 140</li></ul>"}}, {"title": "Dawning Shadow", "description": {"body": "<p><meta></p><ul><li>Damage: 250 / 375 / 500 + 120% bonus Attack Damage + 50% Ability Power → 250 / 400 / 550 + 120% bonus Attack Damage + 70% Ability Power</li><li>Shield: 120 / 160 / 200 + 40% Ability Power + Mist × 4 → 120 / 160 / 200 + 50% Ability Power + Mist × 2</li></ul>"}}]}, {"character": {"name": "YUNARA"}, "changes": [{"title": "Vow of the Lands", "description": {"body": "<p><meta></p><ul><li>Critical bonus damage: 10% (gain 10% per 100 Ability Power) → 8% (gain 8% per 100 Ability Power)</li></ul>"}}, {"title": "Cultivation of Spirit", "description": {"body": "<p><meta></p><ul><li>Bonus Attack Speed: 22.5% / 35% / 47.5% / 60% → 25% / 35% / 45% / 55%</li></ul>"}}]}]}, {"type": "separator"}, {"type": "characterChanges", "title": "Other Critical Strike Champion Adjustments", "characters": [{"character": {"name": "YASUO"}, "changes": [{"title": "Way of the Wanderer", "description": {"body": "<p><meta></p><ul><li>Excess Critical Rate to Attack Damage conversion ratio: 0.6 → 0.5</li><li>Yasuo's basic attacks and (1) ability crits deal 90% of normal critical strike damage.</li></ul>"}}, {"title": "Last Breath", "description": {"body": "<p><meta></p><ul><li>Damage: 250 / 400 / 550 + 160% bonus Attack Damage → 200 / 350 / 500 + 150% bonus Attack Damage</li></ul>"}}]}, {"character": {"name": "GRAVES"}, "changes": [{"title": "New Destiny", "description": {"body": "<p><meta></p><ul><li>Shotgun Critical Strike Damage rate: 1.3 → 1.5&nbsp;</li></ul>"}}]}, {"character": {"name": "YONE"}, "changes": [{"title": "Way of the Hunter", "description": {"body": "<p><meta></p><ul><li>Excess Critical Rate to Attack Damage conversion ratio: 0.6 → 0.5</li><li>Yone's basic attacks and (1) ability crits deal 90% of normal critical strike damage.</li></ul>"}}, {"title": "Mortal Steel", "description": {"body": "<p><meta></p><ul><li>Damage ratio to Jungle Monsters: 65% → 70%</li></ul>"}}, {"title": "Spirit Cleave", "description": {"body": "<p><meta></p><ul><li>Damage: 25 / 35 / 45 / 55 + 11 / 12 / 13 / 14% target’s max Health → 20 / 35 / 50 / 65 + 9 / 10 / 11 / 12% target max Health</li><li>Shield: 45 + 80% bonus Attack Damage → 40 / 55 / 70 / 85 + 60% bonus Attack Damage</li></ul>"}}, {"title": "Soul Unbound", "description": {"body": "<p><meta></p><ul><li>Stored damage ratio: 24 / 28 / 32 / 36% → 27.5% / 30% / 32.5% / 35%</li></ul>"}}, {"title": "Fate Sealed", "description": {"body": "<p><meta></p><ul><li>Damage: 200 / 350 / 500 + 80% Attack Damage → 200 / 375 / 550 + 60% Attack Damage</li></ul>"}}]}, {"character": {"name": "VIEGO"}, "changes": [{"title": "Base Stats", "description": {"body": "<p><meta></p><ul><li>Base Attack Damage: 62 → 60</li><li>Attack Damage Growth: 4.5 → 4.2</li></ul>"}}, {"title": "Sovereign's Domination", "description": {"body": "<p><meta></p><ul><li>Base heal: 7% → 5%</li></ul>"}}, {"title": "Blade of the Ruined King", "description": {"body": "<p><meta></p><ul><li>Critical Damage ratio on current Health damage: current Critical Damage → current Critical Damage × 80%</li><li>Critical Damage ratio on second strike: current Critical Damage → current Critical Damage × 80%</li><li>Thrust damage: 20 / 40 / 60 / 80 ( + 80% Attack Damage) × (1 + 50% × Critical Rate) → 25 / 45 / 65 / 85 ( + 70% Attack Damage) × (1 + 60% × Critical Rate + (Critical Damage-2) × Critical Rate × 60%)</li></ul>"}}, {"title": "Harrowed Path", "description": {"body": "<p><meta></p><ul><li>Attack Speed: 45 / 50 / 55 / 60% → 35 / 40 / 45 / 50%</li></ul>"}}, {"title": "Heartbreaker", "description": {"body": "<p><meta></p><ul><li>Damage: 110% Attack Damage - 165% Attack Damage (based on Critical Rate) + target missing Health × (14 / 17 / 20 + 6% bonus Attack Damage)% → 120% Attack Damage × (1 + 50% × Critical Rate + (Critical Damage - 2) × Critical Rate * 50%) + target missing Health × (14 / 17 / 20 + 5% bonus Attack Damage)%</li></ul>"}}]}, {"character": {"name": "TRYNDAMERE"}, "changes": [{"title": "Base Stats", "description": {"body": "<p><meta></p><ul><li>Base Attack Damage: 54 → 64</li><li>Attack Damage per Level: 5.5 → 5</li><li>Armor per Level: 3.9 → 4.5</li></ul>"}}, {"title": "Battle Fury", "description": {"body": "<p><meta></p><ul><li>[Removed] Landing a basic attack on an enemy champion grants 30% Attack Speed for 5 seconds; after the effect ends, it goes on a 6-second cooldown.</li></ul>"}}, {"title": "Bloodlust", "description": {"body": "<p><meta></p><ul><li>Attack Damage: 7 / 12 / 17 / 22 → 0</li><li>Bonus Attack Damage per 1% missing Health: 0.35 / 0.40 / 0.45 / 0.5 → 0.3 / 0.5 / 0.7 / 0.9</li></ul>"}}, {"title": "Mocking Shout", "description": {"body": "<p><meta></p><ul><li>Attack Damage reduction: 40% → 20 / 40 / 60 / 80%</li></ul>"}}, {"title": "Spinning Slash", "description": {"body": "<p><meta></p><ul><li>Damage: 80 / 120 / 160 / 200 + 135% bonus Attack Damage + 100% Ability Power → 80 / 120 / 160 / 200 + 100% bonus Attack Damage + 80% Ability Power</li><li>Targets that trigger the cooldown reduction on critical strike: Minions → Minions, monsters, champion-summoned units, and other units that can be critically struck&nbsp;</li></ul>"}}, {"title": "Undying Rage", "description": {"body": "<p><meta></p><ul><li>[Removed] Battle Fury's Attack Speed bonus increases to 45 / 60 / 75%</li></ul>"}}]}]}, {"type": "articleRichText", "richText": {"body": "<h3>Champion Durability Adjustments</h3><p>We’re adjusting the durability of several champions to better match how and when they’re intended to take risks in combat. We’re trimming some extreme cases of early-game Health and Armor, while giving champions who regularly dive into the middle of fights more Health growth to help them survive as the game progresses.</p><p>We’re also making targeted durability adjustments to better align certain champions with their intended strengths at different stages of the game. There are quite a few changes here, so check out&nbsp;<strong>Champion Durability Details</strong> in the appendix for the full list.</p>"}}, {"type": "characterChanges", "title": "Other Champion Stats Adjustments", "characters": [{"character": {"name": "OLAF"}, "changes": [{"title": "Base Stats", "description": {"body": "<p><meta></p><ul><li>Base Health: 690 → 660</li><li>Attack Speed Ratio: 0.694</li><li>Base Attack Speed: 0.694</li><li>Base Bonus Attack Speed: 0.06</li><li>Attack Speed per Level: 0.0326</li><li>Health per Level: 112 → 140</li></ul>"}}, {"title": "Undertow", "description": {"body": "<p><meta></p><ul><li>Bonus Attack Damage ratio: 120% → 105%</li></ul>"}}, {"title": "Ragnarok", "description": {"body": "<p><meta></p><ul><li>Armor and Magic Resistance increase: 25 / 35 / 45 → 15 / 25 / 35</li></ul>"}}]}, {"character": {"name": "VOLIBEAR"}, "changes": [{"title": "The Relentless Storm", "description": {"body": "<p><meta></p><ul><li>Damage: 11 - 80 (based on level) + 40% Ability Power → 12 - 68 (based on level) + 40% Ability Power</li></ul>"}}]}, {"character": {"name": "NUNU & WILLUMP"}, "changes": [{"title": "Snowball Barrage", "description": {"body": "<p><meta></p><ul><li>Removed: Damage modifier against monsters: 150%</li></ul>"}}]}, {"character": {"name": "ZED"}, "changes": [{"title": "Razor Shuriken", "description": {"body": "<p><meta></p><ul><li>Removed: Damage modifier against monsters: 80%</li></ul>"}}, {"title": "Shadow Slash", "description": {"body": "<p><meta></p><ul><li>Removed: Damage modifier against monsters: 60%</li></ul>"}}]}]}, {"type": "separator"}, {"type": "articleRichText", "richText": {"body": "<h2>Item Adjustments</h2><h3>Marksman Item Adjustments</h3><p>We’re updating the marksman item system to create more distinct build paths and give each purchase a clearer purpose. New items like Fiendhunter Bolts and Yun Tal Wildarrows are joining the shop, giving marksmen more options to play toward their individual strengths, particularly when choosing their first item.&nbsp;</p><p>We’re also sharpening the identities of existing marksman items by reducing overly broad stat profiles, simplifying some passive effects, and shifting more power into their core stats. Our goal is for each completed item to provide a clear and meaningful damage spike while making build choices more dependent on what your champion does best. For champions whose abilities scale with Critical Strike Chance and Critical Strike Damage, Infinity Edge will also serve as a powerful capstone for maximizing their damage.</p><h4>Dagger</h4><p><i>Base Stats</i></p><ul><li>Price: 500 → 400</li><li>Attack Speed: 15% → 12%</li></ul><h4>Last Whisper</h4><p><i>Base Stats</i></p><ul><li>[New] Build Path: Long Sword (500) + 700</li><li>Price: 800 → 1200</li><li>[New] Attack Damage: 15</li><li>Armor Penetration: 12% → 15%</li></ul><h4>Recurve Bow</h4><p><i>Base Stats</i></p><ul><li>Build Path: Dagger (500) + Dagger (500) + 400 → Dagger (400) + 500</li><li>Price: 1400 → 900</li><li>Attack Speed: 30% → 20%</li></ul><h4>Zeal</h4><p>If you continue to see Movement Speed adjustments below, don't be surprised. They're part of our broader effort to rein in and standardize late-game Movement Speed.</p><p><i>Base Stats</i></p><ul><li>Movement Speed: 5% → 4%</li></ul><h4>Noonquiver</h4><p>We’re introducing Noonquiver to fill a gap in the marksman item system, providing both Attack Damage and Critical Strike Chance in a single component. It should also make building toward items that offer both stats feel smoother and more flexible.</p><p><i>Base Stats</i></p><ul><li>Build Path: Long Sword (500) + Dagger (500) + 350 → Long Sword (500) + Brawler's Gloves (500) + 300</li><li>Price: 1350 → 1300</li><li>Attack Damage: 25 → 20</li><li>[Removed] Attack Speed: 15%</li><li>[New] Critical Rate: 15%</li></ul><h4>Vampiric Scepter</h4><p>For details on&nbsp;<strong>Physical Vamp</strong> and&nbsp;<strong>Lifesteal</strong>, see the section below.&nbsp;</p><p><i>Base Stats</i></p><ul><li>[Removed] Physical Vamp: 8%</li><li>[New] Lifesteal: 8%</li></ul><h4>Kircheis Shard</h4><p>With more items that don’t provide Attack Damage now building from Kircheis Shard, we’re removing its Attack Damage to better support the wider range of items it builds into.&nbsp;</p><p><i>Base Stats</i></p><ul><li>Build Path: Long Sword (500) + 400 → Dagger (400) + 400</li><li>Price: 900 → 800</li><li>[Removed] Attack Damage: 15</li><li>[New] Attack Speed: 20%</li></ul><p><i>Shock</i></p><ul><li>Dealing damage to an enemy champion deals 40 bonus magic damage (25 second cooldown). Attacks reduce this cooldown by 1 second.</li></ul><h4>Pickaxe</h4><p>We’re adjusting Pickaxe to smooth out the build paths for items with lower overall Attack Damage, particularly those that also build from Attack Damage components like Vampiric Scepter or Caulfield’s Warhammer.</p><p><i>Base Stats</i></p><ul><li>Price: 800</li><li>Build Path: Long Sword (500) + 300</li><li>Attack Damage: 20</li></ul><h4>Hearthbound Axe</h4><p>Hearthbound Axe replaces Noonquiver as the mid-tier Attack Speed and Attack Damage component.</p><p><i>Base Stats</i></p><ul><li>Price: 1200</li><li>Build Path: Long Sword (500) + Dagger (400) + 300</li><li>Attack Damage: 20</li><li>Attack Speed: 15%</li></ul><h4>Hexoptics C44</h4><p>We want crit marksmen to have more meaningful choices after completing their first item, and Hexoptics C44 offers a new option for those looking to take over teamfights. Participating in a takedown grants additional Attack Range, helping you keep the momentum going, while your damage increases based on how far you are from your target.</p><p><i>Base Stats</i></p><ul><li>Price: 2900</li><li>Build Path: Pickaxe (800) + Noonquiver (1300) + Long Sword (500) + 300</li><li>Attack Damage: 55</li><li>Critical Rate: 25%</li></ul><p>Magnification</p><ul><li>Attacks deal 0 - 10% bonus damage based on how far away the enemy is, reaching maximum damage at 550 units.</li></ul><p>Arcane Aim</p><ul><li>When a champion you damaged within the last 3 seconds dies, you gain 100 bonus Attack Range for 8 seconds.</li></ul><h4>Yun Tal Wildarrows</h4><p>Yun Tal Wildarrows offers a highly gold-efficient first-item option for crit marksmen, providing Attack Damage, Critical Strike Chance, and Attack Speed. There is a catch, though: its unique Critical Strike Chance stacking mechanic means it takes time to reach its full potential. You’ll need to decide whether the game state gives you enough time to invest in scaling or if you need power right away.</p><p><i>Base Stats</i></p><ul><li>Price: 3100</li><li>Build Path: Noonquiver (1300) + Pickaxe (800) + Kircheis Shard (800) + 200</li><li>Attack Damage: 50</li><li>Critical Rate: 0%</li><li>Attack Speed: 25%</li></ul><p>Practice Makes Perfect</p><ul><li>Basic attacks permanently grant Critical Rate, gaining 0.4% / 0.2% (melee / ranged) Critical Rate per attack, up to a maximum of 25%.</li></ul><p>Flurry</p><ul><li>Attacking an enemy champion grants 25% Attack Speed for 6 seconds (20 second cooldown). Attacks reduce this cooldown by 1 second, and this reduction increases to 2 seconds on a critical strike.</li></ul><p>Energized items</p><p>Consolidating so many Energized effects into a small number of items left marksmen with fewer meaningful choices. Magnetic Blaster, in particular, offered range, waveclear, burst, and kiting all in one package, making it difficult to strengthen crit marksmen without also giving them too much power from a single item. We’re breaking that power back apart. Magnetic Blaster has been removed, with its effects redistributed across three items to create more distinct choices. We’re also reworking Statikk Shiv into an item focused on on-hit marksmen.</p><h4>Stormrazor</h4><p>As an old friend of the Energized family, [Stormrazor] has returned to Summoner's Rift. In the early game, it offers the strongest lane pressure and kiting power for players who want to focus on laning, and champions that rely on heavy-damage basic attacks or need Energized effects can choose it.</p><p><i>Base Stats</i></p><ul><li>Price: 3000</li><li>Build Path: B. F. Sword (1500) + Kircheis Shard (800) + Brawler's Gloves (500) + 200</li><li>Attack Damage: 50</li><li>Critical Rate: 25%</li><li>Attack Speed: 20%</li></ul><p>Energized</p><ul><li>Moving and attacking generate an Energized attack.</li></ul><p>Bolt</p><ul><li>Your Energized attack deals 120 bonus magic damage and grants 45% Movement Speed for 1.5 seconds.</li></ul><h4>Rapid Firecannon</h4><p>Rapid Firecannon is stepping in for Magnetic Blaster as a more specialized option for marksmen who value additional Attack Range. It’s especially useful for champions who need a little extra reach to safely find opportunities to deal damage in teamfights.</p><p><i>Base Stats</i></p><ul><li>Price: 2650</li><li>Build Path: Zeal (1400) + Kircheis Shard (800) + 450</li><li>Critical Rate: 25%</li><li>Attack Speed: 40%</li><li>Movement Speed: 4%</li></ul><p>Energized</p><ul><li>Moving and attacking generate an Energized attack.</li></ul><p>Sharpshooter</p><ul><li>Your Energized attack deals 80 bonus magic damage and grants 35% bonus Attack Range, up to 150.</li></ul><h4>Fiendhunter Bolts</h4><p>When marksmen choose between Zeal items, we want them to have different options based on the situation or the specific needs of their champion. Fiendhunter Bolts provides a powerful window after casting an ultimate, making it a great way to boost burst damage for marksmen who already play around their ultimate, such as Twitch, Zeri, and Yunara.</p><p>Base Stats:</p><ul><li>Attack Speed Ratio: 0.65</li><li>Base Attack Speed: 0.65</li><li>Base Bonus Attack Speed: 0.23</li><li>Attack Speed per Level: 0.032</li><li>2650</li><li>Build Path: Zeal (1400) + Kircheis Shard (800) + 450</li><li>Critical Rate: 25%</li><li>Attack Speed: 45%</li><li>Movement Speed: 4%</li></ul><p>Night Vigil:</p><ul><li>Gain 20 ultimate ability haste.</li></ul><p>Opening Barrage:</p><ul><li>After casting your ultimate ability, your next 3 attacks gain 50% Attack Speed and are guaranteed to crit, dealing 80% of your normal critical strike damage for 8 seconds. If an attack would already crit, it instead deals 15% bonus true damage. (45 second cooldown)</li></ul><p><meta></p><h4>Immortal Shieldbow</h4><p>Immortal Shieldbow is returning as a dedicated defensive option, designed to give marksmen more survivability in the late game.&nbsp;</p><p><i>Base Stats</i></p><ul><li>Price: 3000</li><li>Build Path: Noonquiver (1300) + Pickaxe (800) + 900</li><li>Attack Damage: 55</li><li>Critical Rate: 25%</li></ul><p>Lifeline:</p><ul><li>When you take damage that would reduce you to below 35% Health, gain a shield for 3 seconds (350 - 650 for melee, 300 - 550 for ranged, based on champion level). (70 second cooldown)</li></ul><h4>Statikk Shiv</h4><p>On-hit builds have long lacked some room for itemization, and now Statikk Shiv can join that space as a specialized on-hit option. The new Statikk Shiv allows on-hit builds to apply their effects to multiple enemies at the same time, creating exciting item combinations and helping those builds matter in teamfights.</p><p><i>Base Stats</i></p><ul><li>Price: 3000</li><li>Build Path: Aether Wisp (950) + Pickaxe (800) + Kircheis Shard (800) + 450</li><li>Attack Damage: 40</li><li>Ability Power: 40</li><li>Attack Speed: 30%</li><li>Movement Speed: 4%</li></ul><p>Energized:</p><ul><li>Moving and attacking generate an Energized attack.</li></ul><p>Electrospark:</p><ul><li>Your Energized attack fires chain lightning that bounces to additional targets. Bounce count: 3 / 4 / 5 / 6, increasing at levels 1 / 5 / 9 / 13, dealing 60 magic damage, increased to 90 against minions and monsters. Applies on-hit effects to secondary bounce targets.</li></ul><p>ElectroShock:</p><ul><li>Basic attacks grant 5 bonus Energized stacks.</li></ul><h4>Bloodthirster</h4><p>Bloodthirster is returning to its identity as a high-Attack Damage, high-Lifesteal item and is no longer limited to crit champions.</p><p>Base Stats:</p><ul><li>Build Path: Vampiric Scepter (1200) + Cloak of Agility (1000) + Ruby Crystal (500) + 300 → Vampiric Scepter (1200) + B. F. Sword (1500) + 500</li><li>Price: 3000 → 3200</li><li>Attack Damage: 55 → 75</li><li>[Removed] Critical Rate: 25%</li><li>[Removed] Max Health: 250</li><li>[Removed] Physical Vamp: 8%</li><li>[New] Lifesteal: 15%</li></ul><p>Ichorshield</p><ul><li>Convert overhealing from your Lifesteal into a shield, up to 165 - 345 (based on level).</li></ul><h4>Essence Reaver&nbsp;</h4><p>We've streamlined Essence Reaver's effects, making it slightly weaker on its best users, such as Viego and Lucian, while allowing it to better serve a wider range of champions who want Critical Strike Chance, Attack Damage, and Ability Haste.&nbsp;</p><p>Base Stats:</p><ul><li>Build Path: Sheen (800) + Cloak of Agility (1000) + Long Sword (500) + 700 → Sheen (800) + Caulfield's Warhammer (1200) + Brawler's Gloves (500) + 500</li><li>Attack Damage: 35 → 50</li></ul><p>Spellblade:</p><ul><li>After casting an ability, your next basic attack within 10 seconds deals bonus physical damage equal to 135% × base Attack Damage + 0 - 80 (Based on Critical Rate) and restores Mana equal to 50% of the damage dealt. (1.5 second cooldown)</li></ul><h4>Galeforce</h4><p><i>Base Stats</i></p><ul><li>Build Path: Zeal (1400) + B. F. Sword (1500) + 200 → Noonquiver (1300) + Pickaxe (800) + Long Sword (500) + 500</li><li>Attack Damage: 50 → 60</li><li>[Removed] Attack Speed: 15%</li><li>Movement Speed: 5% → 4%</li></ul><h4>The Collector</h4><p><i>Base Stats</i></p><ul><li>Build Path: Serrated Dirk (1000) + Cloak of Agility (1000) + 1000 → Serrated Dirk (1000) + Noonquiver (1300) + 700</li><li>Attack Damage: 45 → 50</li></ul><p>Death and Taxes:</p><ul><li>If you deal damage to an enemy champion and leave them below 5% of their max Health, they are executed, permanently increasing the execute threshold by 0.1% of max Health and granting an additional 25 gold.</li></ul><h4>Kraken Slayer</h4><p><i>Base Stats</i></p><ul><li>Build Path: Noonquiver (1300) + Dagger (500) + Long Sword (500) + 500 → Recurve Bow (900) + Hearthbound Axe (1200) + Long Sword (500) + 300</li><li>Price: 2800 → 2900</li><li>Attack Damage: 40 → 45</li><li>Attack Speed: 30% → 35%</li><li>Movement Speed: 5% → 4%</li></ul><p>Bring It Down:</p><ul><li>Every third attack now deals 150 - 210 bonus physical damage, or 120 - 168 for ranged champions. This damage is increased based on the target's missing Health. For every 1% Health the target is missing, damage increases by 0.75%, up to 75%.</li><li>Optimized its interaction with Yunara's 1st ability; Yunara's 1st ability spread effect can now trigger [Bring It Down].</li></ul><h4>Blade of the Ruined King</h4><p>For details on&nbsp;<strong>Physical Vamp</strong> and&nbsp;<strong>Lifesteal</strong>, see the section below.&nbsp;</p><p><i>Base Stats</i></p><ul><li>Build Path: Vampiric Scepter (1200) + Recurve Bow (1400) + 400 → Vampiric Scepter Scepter (1200) + Pickaxe (800) + Recurve Bow (900) + 200</li><li>Price: 3200 → 3100</li><li>Attack Speed: 35% → 30%</li><li>[Removed] Omnivamp: 10%</li><li>[New] Lifesteal: 12%</li></ul><p>Ruined Strike:</p><ul><li>Basic attacks deal bonus physical damage on hit equal to 7% of the target's current Health (8.5% for melee), with a minimum of 15 and a maximum of 100 against monsters.</li></ul><p>Drain:</p><ul><li>Hitting the same enemy champion 3 times with basic attacks or abilities slows them by 30% for 1.5 seconds (30 second cooldown).</li></ul><h4>Guinsoo's Rageblade</h4><p>Guinsoo’s Rageblade has long been a staple for on-hit marksmen, but giving up Critical Strike Chance to build it can feel like too steep a tradeoff. We’re removing its Critical Strike Chance restriction, giving on-hit champions more flexibility in their builds while keeping Rageblade’s power focused on repeatedly triggering on-hit effects rather than dealing additional damage of its own.</p><p><i>Base Stats:</i></p><ul><li>Build Path: Nashor's Talon (800) + Recurve Bow (1400) + 900 → Amplifying Tome (500) + Recurve Bow (900) + Pickaxe (800) + + 800</li><li>Price: 3100 → 3000</li><li>[New] Attack Damage: 35</li><li>[New] Ability Power: 30</li><li>[Removed] Movement Speed: 5%</li></ul><p>Wrath:</p><ul><li>Attacks deal 30 bonus magic damage.</li></ul><p>Seething Strike:</p><ul><li>Basic attacks grant 8% Attack Speed, stacking up to 4 times. At max stacks, every 3rd basic attack triggers an additional on-hit effect.</li></ul><h4>At Wit's End</h4><p><i>Base Stats</i></p><ul><li>Build Path: Recurve Bow (1400) + Negatron Cloak (900) + 500 → Recurve Bow (900) + Negatron Cloak (900) + Dagger (400) + 600</li><li>Attack Speed: 45% → 50%</li><li>[New] Tenacity: 20%</li></ul><p>At Wit's End:</p><ul><li>Basic attacks deal 40 bonus magic damage on hit.</li></ul><h4>Terminus</h4><p><i>Base Stats</i></p><ul><li>Build Path: Recurve Bow (1400) + B. F. Sword (1500) + 400 → Recurve Bow (900) + Hearthbound Axe (1200) + 900</li><li>Total Price: 3300 → 3000</li><li>Attack Damage: 40 → 35</li><li>Attack Speed: 30% → 35%</li></ul><p>Shadow</p><ul><li>Basic attacks deal 30 bonus magic damage on hit.</li></ul><p>Juxtaposition&nbsp;</p><ul><li>The light effect grants 5 - 8 Armor and Magic Resist; the dark effect grants 10% Armor Penetration and Magic Penetration, stacking up to 3 times.</li></ul><h4>Phantom Dancer</h4><p><i>Base Stats</i></p><ul><li>Build Path: Zeal (1400) + Dagger (500) + Long Sword (500) + 500 → Zeal (1400) + Dagger (400) + Dagger (400) + 450</li><li>Price: 2900 → 2650</li><li>[Removed] Attack Damage: 20</li><li>Movement Speed: 5% → 7%</li></ul><p>Spectral Waltz:</p><ul><li>Landing a basic attack on a champion grants 6% Attack Speed and 1% Movement Speed for 6 seconds, stacking up to 5 times.</li></ul><h4>Runaan's Hurricane</h4><p><i>Base Stats</i></p><ul><li>Build Path: Recurve Bow (1400) + Cloak of Agility (1000) + 500 → Zeal (1400) + Kircheis Shard (800) + 450</li><li>Price: 2900 → 2650</li><li>Attack Speed: 35% → 40%</li><li>[New] Movement Speed: 4%</li></ul><p>Wind's Fury:</p><ul><li>Basic attacks fire mini bolts at 2 nearby targets on hit, each dealing 55% physical damage. These bolts can crit and apply on-hit effects.</li></ul><p>Wind Blade</p><ul><li>[Removed]</li></ul><h4>Mortal Reminder</h4><p>We want Mortal Reminder to stand out through its slot efficiency rather than directly competing with other Armor Penetration options that offer similar stats. We’re sharpening its identity so the choice between penetration items is clearer, making it easier to understand what you’re gaining from each option and when Mortal Reminder is the right fit for your build.</p><p><i>Base Stats</i></p><ul><li>Build Path: Last Whisper (800) + Executioner's Calling (800) + Cloak of Agility (1000) + 900 → Last Whisper (1200) + Executioner's Calling (800) + Brawler's Gloves (500) + 500</li><li>Price: 3300 → 3000</li><li>Attack Damage: 25 → 35</li><li>[Removed] Attack Speed: 15%</li><li>[New] Armor Penetration: 30%</li></ul><p>Sepsis:</p><ul><li>Physical damage dealt to enemy champions applies 50% Grievous Wounds for 3 seconds.</li></ul><p>Last Whisper</p><ul><li>Integrated into base stats.</li></ul><h4>Infinity Edge</h4><p>With the increase to base Critical Strike Damage, Infinity Edge is already compelling enough, making its Critical Strike Damage passive feel somewhat redundant.</p><p><i>Base Stats</i></p><ul><li>Build Path: B. F. Sword (1500) + Cloak of Agility (1000) + 900 → B. F. Sword (1500) + Pickaxe (800) + Brawler's Gloves (500) + 700</li><li>Attack Damage: 65 → 75</li></ul><p><br>Infinity:</p><ul><li>Critical strike damage increased from 200% to 230%.</li></ul><p>Limit Break:</p><ul><li>[Removed]</li></ul><h4>Manamune</h4><p>The Mana consumption mechanic on completed Tear of the Goddess items has become outdated. We removed it from Seraph’s Embrace last patch, and now Manamune and Muramana are getting the same treatment, making their effects less dependent on spending Mana.</p><p><i>Base Stats</i></p><ul><li>Build Path: Tear of the Goddess (500) + Caulfield's Warhammer (1200) + 1000 → Caulfield's Warhammer (1200) + Tear of the Goddess (400) + Long Sword (500) + 800</li><li>Price: 2700 → 2900</li><li>Attack Damage: 25 → 40</li><li>Mana: 300 → 500</li><li>Ability Haste: 20 → 15</li></ul><p>AWE:</p><ul><li>Gain Attack Damage equal to 2% of max Mana and refund 15% of total Mana spent.</li></ul><p>Mana Charge:</p><ul><li>Basic attacks and Mana expenditure grant 14 max Mana, up to 700. Triggers at most 3 times every 10 seconds.</li></ul><h4>Muramana</h4><p><i>Base Stats</i></p><ul><li>Price: 2700 → 2900</li><li>Attack Damage: 25 → 40</li><li>Ability Haste: 20 → 15</li></ul><p>AWE:</p><ul><li>Gain Attack Damage equal to 2% of max Mana and refund 15% of total Mana spent.</li></ul><p>Shock:</p><ul><li>Basic attacks deal bonus physical damage equal to 1.5% of max Mana; abilities deal bonus physical damage equal to 3.5% / 3% of max Mana for melee / ranged.</li></ul><h4>Serylda's Grudge</h4><p>Serylda’s Grudge has been offering too much utility to champions outside of its intended audience. We’re reworking its Slow and Grievous Wounds effects while strengthening its core stats, sharpening its identity as an Armor Penetration option for high-burst champions.</p><p><i>Base Stats</i></p><ul><li>Build Path: Caulfield's Warhammer (1200) + Last Whisper (800) + Long Sword (500) + 800 → Caulfield's Warhammer (1200) + Last Whisper (1200) + 700</li><li>Price: 3300 → 3100</li><li>Attack Damage: 40 → 50</li><li>[New] Armor Penetration: 35%</li></ul><p>Icy:</p><ul><li>Damaging active abilities and empowered attacks slow enemies below 60% current Health by 30% Movement Speed for 1 second.</li></ul><p>Last Whisper</p><ul><li>Integrated into base stats.</li></ul><p>Frostbite:</p><ul><li>[Removed]</li></ul><h4>Navori Quickblades</h4><p><i>Base Stats</i></p><ul><li>Price: 2800 → 2650</li><li>Attack Speed: 45% → 40%</li><li>Movement Speed: 5% → 4%</li></ul><h4>Lord Dominik's Regards</h4><p><i>Base Stats</i></p><ul><li>Build Path: Last Whisper (800) + Long Sword (500) + Cloak of Agility (1000) + 1000 → Last Whisper (1200) + Noonquiver (1300) + 800</li><li>Attack Damage: 30 → 35</li><li>Armor Penetration: 36% → 35%</li></ul><h4>Mercurial Scimitar</h4><p><i>Base Stats</i></p><ul><li>[Removed] Physical Vamp: 10%</li><li>[New] Lifesteal: 12%</li></ul><h4>Removed</h4><ul><li>As mentioned above, Magnetic Blaster has been removed due to being too much of an all-purpose item.<ul><li>Magnetic Blaster</li></ul></li><li>Soul Transfer has struggled to find its intended audience, so we've decided to take it off the Rift for now.<ul><li>Soul Transfer</li></ul></li><li>Cloak of Agility overlaps too heavily with Brawler's Gloves, and there are few situations where stacking Critical Strike Chance takes priority over building Attack Damage.<ul><li>Cloak of Agility</li></ul></li><li>Nashor's Talon has lost its last remaining user. It's time for it to leave the Rift.<ul><li>Nashor's Talon</li></ul></li></ul><h3>Other Item Adjustments</h3><p>Alongside the marksman item overhaul, we’re also sharpening the identities of items for other classes. Some items currently offer too many different stats at once, which can leave them without a clear purpose or create unintended synergies. We’re streamlining these stat profiles so each item has a more defined role and a clearer reason to build it.</p><h4>Winged Moonplate</h4><p><i>Base Stats</i></p><ul><li>Movement Speed: 5% → 4%</li></ul><h4>Bami's Cinder</h4><p>Following the changes to Smite (see below), Shimmering Spark no longer has a place as a starting item, so we're removing it and adjusting Bami's Cinder's build path accordingly.&nbsp;</p><p><i>Base Stats</i></p><ul><li>Build Path: Shimmering Spark (500) + Ruby Crystal (500) + 300 → Ring of Revelation (300) + Ruby Crystal (500) + 400</li><li>Total Price: 1300 → 1200</li><li>[New] Ability Haste: 5</li></ul><h4>Aether Wisp</h4><p><i>Base Stats</i></p><ul><li>Movement Speed: 5% → 4%</li></ul><h4>Phage</h4><p>Rage:</p><ul><li>Each time a basic attack hits a unit, gain 20 Movement Speed for 2 seconds. This Movement Speed bonus does not stack, and the effect is halved for ranged champions.</li></ul><h4>Forbidden Idol</h4><p>Forbidden Idol and the items it builds into have been offering too many different stats at once, allowing enchanters to stack powerful healing and shielding while also gaining significant durability and other benefits.</p><p>We’re sharpening the identity of these components by specializing Forbidden Idol around Heal and Shield Power. The new Bandleglass Mirror will instead serve as the go-to component for Ability Power and Ability Haste, creating clearer build paths based on the stats you need.</p><p><i>Base Stats</i></p><ul><li>Build Path: No recipe</li><li>Price: 900 → 700</li><li>Heal and Shield Power: 4% → 6%</li><li>[Removed] Health: 100</li><li>[Removed] Ability Haste: 5</li></ul><h4>Bandleglass Mirror</h4><p>Bandleglass Mirror is a mid-tier support item component that provides Ability Power and Ability Haste.&nbsp;</p><p><i>Base Stats</i></p><ul><li>Build Path: Amplifying Tome (500) + Ring of Revelation (300) + 100</li><li>Total Price: 900</li><li>Ability power: 20</li><li>Base Mana Regen: 50%</li><li>Ability Haste: 10</li></ul><h4>Whispering Circlet</h4><p><i>Base Stats</i></p><ul><li>Price: 2400</li><li>Build Path: Forbidden Idol (700) + Tear of the Goddess (400) + Ruby Crystal (500) + 800</li><li>Health: 200</li><li>Maximum Mana: 500</li><li>Base Mana Regen: 50%</li><li>Heal and Shield Power: 8%</li></ul><p>Harmony:</p><ul><li>Gain bonus Heal and Shield Power equal to 0.5% of max Mana and refund 25% of Mana spent.</li></ul><p>Mana Charge:</p><ul><li>Mana expenditure grants 14 max Mana, up to 700. This can trigger at most 2 times every 10 seconds. At max stacks, it automatically upgrades into Diadem of Songs.</li></ul><h4>Diadem of Songs</h4><p><i>Base Stats</i></p><ul><li>Build Path: Whispering Circlet</li><li>Health: 200</li><li>Mana: 1200</li><li>Base Mana Regen: 50%</li><li>Heal and Shield Power: 8%</li></ul><p>Harmony:</p><ul><li>Gain bonus Heal and Shield Power equal to 0.5% of max Mana and refund 25% of Mana spent.</li></ul><p>Diadem</p><ul><li>If either you or an allied champion you healed or shielded within the last 3 seconds is in combat, heal the nearby allied champion with the lowest Health within 800 units each second for an amount equal to 0.8% of your max Mana.</li></ul><h4>Echoes of Helia</h4><p>Echoes of Helia is tailor-made for offensive supports looking to turn their damage into healing.&nbsp;</p><p><i>Base Stats</i></p><ul><li>Price: 2400</li><li>Build Path: Bandleglass Mirror (900) + Kindlegem (1000) + 500</li><li>Health: 200</li><li>Ability Power: 40</li><li>Ability Haste: 20</li><li>Base Mana Regen: 50%</li></ul><p>Soul Siphon:</p><ul><li>30% of pre-mitigation damage dealt to enemy champions is stored as Soul Fragments, with a maximum of 80 - 250 based on level. When you heal or shield an allied champion other than yourself, all Soul Fragments are consumed to heal that target for an equal amount.</li></ul><h4>Ardent Censer</h4><p>In addition to addressing the mixed-stat issue mentioned above, we're also narrowing the buffs Ardent Censer provides to marksmen, particularly crit marksmen, so supports don't have to pay as much attention to their own level or how much Critical Strike Chance their marksman currently has.&nbsp;</p><p><i>Base Stats</i></p><ul><li>Build Path: Forbidden Idol (900) + Aether Wisp (950) + Ring of Revelation (300) + 550 → Forbidden Idol (700) + Aether Wisp (950) + 750</li><li>Price: 2700 → 2400</li><li>Ability Power: 45 → 50</li><li>Heal and Shield Power: 5% → 8%</li><li>Movement Speed: 5% → 4%</li><li>[Removed] Ability Haste: 10</li><li>[Removed] Health: 250</li></ul><p>Censer:</p><ul><li>Shielding or healing an allied champion other than yourself empowers both you and that champion for 6 seconds, granting 30% bonus Attack Speed and 25 bonus magic damage on basic attacks.</li></ul><h4>Staff of Flowing Waters</h4><p><i>Base Stats</i></p><ul><li>Price: 2500 → 2400</li><li>Health: 100 → 0</li><li>Heal and Shield Power: 5% → 8%</li><li>Ability Haste: 15 → 10</li></ul><p>Rapids:</p><ul><li>Shielding or healing an allied champion other than yourself empowers both you and that champion for 6 seconds, granting 40 Ability Power and 15 Ability Haste.</li></ul><h4>Salvation</h4><p><i>Base Stats</i></p><ul><li>Price: 2600 → 2450</li><li>Health: 150 → 0</li><li>Ability Power: 50 → 40</li><li>Heal and Shield Power: 5% → 8%</li><li>Ability Haste: 15 → 10</li></ul><h4>Shurelya's Battlesong</h4><p><i>Base Stats</i></p><ul><li>Build Path: Aether Wisp (950) + Amplifying Tome (500) + Ring of Revelation (300) + 750 → Bandleglass Mirror (900) + Aether Wisp (950) + 600</li><li>Movement Speed: 5% → 4%</li></ul><h4>Imperial Mandate</h4><p>Imperial Mandate has become a little too closely tied to Nami, while its trigger condition and power spike haven’t always been easy to understand. We’re giving it a refresh with clearer functionality and a stronger identity as an option for crowd control-focused mages.</p><p><i>Base Stats</i></p><ul><li>Build Path: Fiendish Codex (900) + Kindlegem (1000) + 600 → Bandleglass Mirror (900) + Blasting Wand (800) + 900</li><li>Price: 2500 → 2600</li><li>Health: 200 → 0</li><li>Ability Power: 50 → 60</li><li>[New] Base Mana Regen: 50%</li></ul><p>Control:</p><ul><li>Crowd&nbsp;Control abilities gain 20 Ability Haste.</li></ul><p>Command:</p><ul><li>Crowd-controlling an enemy champion marks them for 4 seconds, causing them to take 7% increased damage during that time.</li></ul><h4>Harmonic Echo</h4><p>Harmonic Echo has been scaling a little too well with Ability Haste and Heal and Shield Power, allowing some champions to provide an overwhelming amount of healing in the late game. We’re reworking it into a chain healing and shielding item. Rather than simply amplifying repeated healing, champions with powerful heals and shields can now use Harmonic Echo to spread those effects to additional teammates, giving the item a clearer role in supporting the whole team.</p><p><i>Base Stats</i></p><ul><li>Build Path: Lost Chapter (1200) + Forbidden Idol (900) + Amplifying Tome (500) + 100 → Bandleglass Mirror (900) + Kindlegem (1000) + 600</li><li>Price: 2800 → 2500</li><li>Health: 100 → 200</li><li>Ability Power: 50 → 40</li><li>Ability Haste: 15 → 20</li><li>[Removed] Max Mana: 300</li><li>[Removed] Heal and Shield Power: 5%</li></ul><p>Harmonic Echo:</p><ul><li>When you heal or shield an allied champion, the effect links to the nearest allied champion within range with the lowest percentage Health, excluding yourself, and grants them 30% of that heal or 35% of that shield. If no other allied champion is in range, the original target instead receives that same extra heal or shield.</li></ul><h4>Knight's Vow</h4><p><i>Base Stats</i></p><ul><li>Build Path: Kindlegem (1000) + Chain Vest (900) + 700 → Kindlegem (1000) + Chain Vest (900) + 550</li><li>Price: 2600 → 2450</li><li>Health: 400 → 200</li></ul><h4>Zeke's Convergence</h4><p>Some Zeke’s Convergence users cast their ultimate before getting close to the action, making it difficult to get full value from the item. We’re adjusting its effect to better support champions who engage from range. We’re also redistributing some of the Armor on tank support items into Magic Resist. This should give tank supports more balanced durability against physical and magic damage, rather than making them exceptionally tough against marksmen while leaving them overly vulnerable to mages.</p><p><i>Base Stats</i></p><ul><li>Build Path: Glacial Shroud (1000) + Giant's Belt (1000) + 700 → Kindlegem (1000) + Cloth Armor (500) + Null-Magic Mantle (500) + 400</li><li>Price: 2700 → 2400</li><li>Health: 400 → 300</li><li>[Removed] Mana: 150</li><li>Armor: 40 → 25</li><li>[New] Magic Resist: 25</li><li>Ability Haste: 15 → 10</li></ul><p>Converge:</p><ul><li>Gain 10 ultimate ability haste.</li></ul><p>Frostfire Tempest:</p><ul><li>Casting your ultimate ability deals 150 magic damage and slows nearby enemies by 30% over 5 seconds. If no enemy champion is in range when the ultimate is cast, the effect is delayed until up to 5 seconds later or until an enemy champion enters range.</li></ul><h4>Yordle Trap</h4><p>Yordle Trap Device has become too focused on snowballing through the extra Gold it generates, while its payoff can feel inconsistent from game to game. We also want support items to encourage you to, well, support your team. We’re shifting more of the item’s power away from Gold generation and into buffs for your allies. Don’t worry, though, you’ll still pocket a little extra Gold along the way.</p><p><i>Base Stats</i></p><ul><li>Build Path: Chain Vest (900) + Kindlegem (1000) + 700 → Kindlegem (1000) + Cloth Armor (500) + Null-Magic Mantle (500) + 400</li><li>Price: 2600 → 2400</li><li>Health: 350 → 200</li><li>Armor: 40 → 20</li><li>[New] Magic Resist: 20</li></ul><p>Catcher:</p><ul><li>Slowing or immobilizing an enemy champion empowers you for 8 / 4s, melee / ranged, granting 20 Movement Speed. During this time, you and nearby allies gain 30% / 20% bonus Attack Speed, melee / ranged. If an ally, including you, gets a kill while inspired, you gain 20 gold.</li></ul><h4>Mantle of the Twelfth Hour</h4><p>Mantle of the Twelfth Hour is meant to help tanks survive heavy bursts of damage, but its high price and reliance on resistances have made it difficult to justify. We’re addressing both issues to make it a more reliable anti-burst option and a worthwhile choice earlier in a tank’s build.</p><p><i>Base Stats</i></p><ul><li>Build Path: Surging Scales (1300) + Negatron Cloak (900) + 500 → Kindlegem (1000) + Giant's Belt (1000) + 550</li><li>Price: 2700 → 2550</li><li>Health: 200 → 600</li><li>[Removed] Armor: 40</li><li>[Removed] Magic Resist: 40</li><li>[New] Ability Haste: 20</li></ul><p>Lifeline:</p><ul><li>When you drop below 30% max Health, immediately gain 200 - 300 bonus Health for 5 seconds, and heal over 5 seconds for 200 - 400 + 120% bonus Armor + 120% bonus Magic Resistance + 15% bonus Health. During this time, gain 10% size, 10% bonus Movement Speed, and 20% Tenacity.</li></ul><h4>Frozen Heart</h4><p>Frozen Heart has drifted away from its intended purpose, with its current effect asking users to hit multiple enemies with abilities just to apply its debuff. We’re bringing it back to its roots as an item for tanks who dive straight into the heart of the enemy team, allowing them to disrupt nearby opponents simply by being in the thick of the fight.</p><p><i>Base Stats</i></p><ul><li>Price: 2650 → 2550</li><li>Max Mana: 250 → 400</li></ul><p>Winter's Caress:</p><ul><li>All enemy champions within 650 units lose 25% Attack Speed.</li></ul><h4>Radiant Virtue</h4><p><i>Base Stats</i></p><ul><li>Build Path: Kindlegem (1000) + Chain Vest (900) + 950 → Giant's Belt (1000) + Cloth Armor (500) + Null-Magic Mantle (500) + 650</li><li>Price: 2850 → 2650</li><li>Armor: 45 → 30</li><li>[New] Magic Resist: 30</li><li>Ability Haste: 15 → 10</li></ul><h4>Abyssal Mask</h4><p>Abyssal Mask has struggled to find a clear audience and purpose. We’re refocusing it as a more accessible option for tank supports and other low-economy champions, helping them empower their teammates without needing a hefty Gold income.</p><p><i>Base Stats</i></p><ul><li>Build Path: Kindlegem (1000) + Negatron Cloak (900) + Ruby Crystal (500) + 600 → Kindlegem (1000) + Negatron Cloak (900) + 500</li><li>Price: 3000 → 2400</li><li>Health: 400 → 350</li><li>Magic Resist: 55 → 45</li></ul><p>Unmake:</p><ul><li>All enemy champions within 6.5 meters take 12% increased magic damage.</li></ul><h4>Gunmetal Greaves</h4><p>For details on&nbsp;<strong>Physical Vamp</strong> and&nbsp;<strong>Lifesteal</strong>, see the section below.&nbsp;</p><p><i>Base Stats</i></p><ul><li>[Removed] Physical Vamp: 5%</li><li>[New] Lifesteal: 5%</li></ul><h4>Death's Dance</h4><p>Death’s Dance has been leaning too heavily on Defy, leaving its base stats weaker than we’d like. We’re making Defy harder to trigger while strengthening the item’s core stats in return, giving its users more consistent combat power even when Defy isn’t active.</p><p><i>Base Stats</i></p><ul><li>Build Path: Caulfield's Warhammer (1200) + Chain Vest (900) + 1000 → Caulfield's Warhammer (1200) + Chain Vest (900) + Pickaxe (800) + 300</li><li>Total Price: 3100 → 3200</li><li>Attack Damage: 35 → 50</li><li>Armor: 40 → 45</li></ul><p>Defy:</p><ul><li>If a champion you damaged within the last 3 seconds dies, the remaining Ignore Pain damage is cleansed, and you heal over 2 seconds for an amount equal to 90% bonus Attack Damage.</li></ul><p>Cauterize:</p><ul><li>Store 30% of physical and magic damage taken, or 12% for ranged champions, and take the stored amount as true damage over 3 seconds.</li></ul><h4>Winter's Approach</h4><p><i>Base Stats</i></p><ul><li>Build Path: Tear of the Goddess (500) + Giant's Belt (1000) + 1100 → Tear of the Goddess (400) + Giant's Belt (1000) + Kindlegem (1000) + 200</li><li>Max Health: 350 → 500</li></ul><p>AWE:</p><ul><li>Gain bonus Health equal to 15% of max Mana and refund 15% of total Mana spent.</li></ul><p>Mana Charge:</p><ul><li>Basic attacks, Mana expenditure, and taking damage from champions, structures, and epic monsters grant 14 max Mana. This effect grants up to 700 max Mana and can trigger at most 3 times every 10 seconds. Limited to one Tear of the Goddess item.</li></ul><h4>Fimbulwinter</h4><p><i>Base Stats</i></p><ul><li>Max Health: 350 → 500</li></ul><p>Awe:</p><ul><li>Gain bonus Health equal to 15% of max Mana and refund 15% of total Mana spent.</li></ul><p>Frozen Colossus:</p><ul><li>Whenever you impair an enemy champion's movement, gain a shield for 3 seconds that absorbs 120 + 4.5% max Mana. If more than one enemy champion is nearby, the shield is increased by 80%. (8 second cooldown) Ranged champions use this shield at 50% effectiveness.</li></ul><h4>Amaranth's Twinguard</h4><p>We’ve always intended Amaranth’s Twinguard to be the capstone item for tanks, much like Infinity Edge for crit marksmen or Rabadon’s Deathcap for mages. Right now, it isn’t quite hitting that mark. It’s too appealing to champions outside the tank class, while tanks themselves don’t always feel a meaningful power spike when completing it We’re shifting some of its raw resistances into Health and bonus resistances, giving tanks a more noticeable durability spike when they complete Twinguard while reducing some of its late-game synergy with percentage-based resistance effects. This should also make it less appealing to champions who don’t invest heavily in bonus resistances. Yes, fighters, we’re looking at you.</p><p><i>Base Stats</i></p><ul><li>Build Path: Surging Scales (1300) + Negatron Cloak (900) + 900 → Giant's Belt (1000) + Chain Vest (900) + Negatron Cloak (900) + 400</li><li>Total Price: 3100 → 3200</li><li>[New] Health: 300</li><li>Armor: 60 → 50</li><li>Magic Resist: 60 → 50</li></ul><p>Endurance:&nbsp;</p><ul><li>While in combat with enemy champions, gain 1 Endurance stack each second, up to 5 stacks. At max stacks, gain 20% increased size, 20% Tenacity, 30% bonus Armor, and 30% bonus Magic Resistance until leaving combat.</li></ul><h4>Dead Man's Plate</h4><p><i>Base Stats</i></p><ul><li>Build Path: Winged Moonplate (900) + Surging Scales (1300) + 600 → Winged Moonplate (900) + Chain Vest (900) + Ruby Crystal (500) + 500</li><li>Movement Speed: 5% → 4%</li></ul><h4>Force of Nature</h4><p>Force of Nature has become too dominant as the answer to magic damage, particularly due to its percentage damage reduction. We’re removing that effect to bring down some of its more extreme defensive cases and create more room for other Magic Resistance items to shine. This also gives us more flexibility to adjust the Magic Resistance system and mage ecosystem in the future. We’ll be keeping a close eye on mage performance following these changes.</p><p><i>Base Stats</i></p><ul><li>Build Path: Winged Moonplate (900) + Spectre's Cowl (1100) + 750 → Winged Moonplate (900) + Negatron Cloak (900) + Ruby Crystal (500) + 500</li><li>Price: 2750 → 2800</li><li>Max Health: 350 → 400</li></ul><p>Absorb:</p><ul><li>Taking magic damage from enemy champions grants 1 Steadfast stack, up to 4, for 7 seconds. Dealing damage to enemy champions refreshes the duration. At max stacks, gain 6% Movement Speed and 70 bonus Magic Resist.</li></ul><h4>Youmuu's Ghostblade</h4><p>We’re making Youmuu’s Ghostblade a more consistent option by moving its Movement Speed away from the stacking mechanic and into persistent and out-of-combat Movement Speed. This should make its mobility more reliable, whether you’re moving around the map or looking for your next fight.</p><p><i>Base Stats</i></p><ul><li>[New] Movement Speed: 4%</li></ul><p>Momentum:</p><ul><li>3 seconds after combat with enemy champions ends, gain 30 bonus Movement Speed, or 20 for ranged champions.</li></ul><p>Spectral Haste [Removed]</p><h4>Titanic Hydra</h4><p><i>Base Stats</i></p><ul><li>Build Path: Bami's Cinder (1300) + Jaurim's Fist (1200) + 500 → Pickaxe (800) + Jaurim's Fist (1200) + Ruby Crystal (500) + 500</li></ul><h4>Cosmic Drive</h4><p><i>Base Stats</i></p><ul><li>Movement Speed: 5% → 4%</li></ul><h4>Trinity Force</h4><p><i>Base Stats</i></p><ul><li>Build Path: Sheen (800) + Phage (1000) + Stinger (1200) + 333 → Sheen (800) + Phage (1000) + Hearthbound Axe (1200) + 333</li><li>Attack Damage: 30 → 36</li><li>Ability Haste: 20 → 15</li><li>Movement Speed: 5% → 0</li></ul><h4>Dusk and Dawn</h4><p>Dusk and Dawn is just one step away from being the perfect item. A bit of healing should help give it stronger sustained combat power.&nbsp;</p><p><i>Base Stats</i></p><ul><li>Ability Power: 70 → 60</li><li>Max Health: 350 → 300</li><li>Attack Speed: 25% → 20%</li></ul><p>Spellblade:</p><ul><li>After casting an ability, your next attack deals bonus magic damage equal to 75% base Attack Damage + 10% Ability Power and heals you for 10% Ability Power + 3% bonus Health. Shortly afterward, it applies on
