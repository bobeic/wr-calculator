name: CN stats update

# Fetches the CN server's win, pick and ban rates (Tencent) Diamond+ builds (wrchina.gg) and CN feed changes (preview) and opens a pull request when they changed. Tencent publishes
# them daily. Runs every day (and by hand), and merges its own pull request once the full typecheck and tests pass.
# Needs the "Allow GitHub Actions to create and approve pull requests" setting, which is on (user, 2026-10-03).
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch the latest CN stats
        run: pnpm --filter @wr-calc/data cn-stats:update | tee cn-stats.log
      - name: Fetch the latest CN builds
        run: pnpm --filter @wr-calc/data cn-builds:update | tee -a cn-stats.log
      - name: Check the CN feed for changes
        run: pnpm --filter @wr-calc/data cn-preview:update | tee -a cn-stats.log
      # The whole suite, not just the CN tests: the PR merges itself, and CI doesn't run on PRs opened by this token.
      - name: Check the result
        run: pnpm typecheck && pnpm test
      - name: Open a pull request
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: cn-stats-update/auto
          commit-message: 'chore: refresh CN server win rates and builds'
          title: 'CN stats update'
          body-path: cn-stats.log
          add-paths: |
            packages/data/src/cn-stats/generated
            packages/data/src/cn-builds/generated
            packages/data/src/cn-preview/generated
            packages/data/snapshots/tencent
          delete-branch: true
      - name: Merge it
        if: steps.pr.outputs.pull-request-number && steps.pr.outputs.pull-request-operation != 'closed'
        run: gh pr merge ${{ steps.pr.outputs.pull-request-number }} --squash --delete-branch
        env:
          GH_TOKEN: ${{ github.token }}
      # A merge made with this token doesn't trigger the push-to-main deploy, so start it by hand.
      - name: Redeploy the site
        if: steps.pr.outputs.pull-request-number && steps.pr.outputs.pull-request-operation != 'closed'
        run: gh workflow run deploy-site.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
